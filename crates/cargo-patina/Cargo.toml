[package]
name = "cargo-patina"
description = "Cargo subcommand for Patina deterministic runs"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
patina-dst.workspace = true
patina-dst-syscalls.workspace = true
patina-dst-abi.workspace = true
patina-dst-fs-mem.workspace = true
patina-dst-minimize.workspace = true
patina-dst-native-shim.workspace = true
patina-dst-runtime.workspace = true
patina-dst-target.workspace = true
patina-dst-trace.workspace = true
# The native-shim source bundle. `cargo-patina` carries the shim's full source
# closure embedded (build.rs packs it) so an installed binary can build a guest's
# linked shim without the Patina checkout present. build.rs learns each crate's
# source directory over cargo's `links`/`DEP_<pkg>_SRC_DIR` channel, which cargo
# exposes only to a DIRECT dependent — so `cargo-patina` must depend directly on
# every crate in the closure, not merely reach it transitively. The crates below
# are direct deps purely for that reason (the closure's others appear above
# already for their own APIs); see crates/patina-native-shim/AGENTS.md.
patina-dst-driver-api.workspace = true
patina-dst-fs-crash.workspace = true
patina-dst-net-sim.workspace = true
patina-dst-rng-seeded.workspace = true
patina-dst-sched-det.workspace = true
patina-dst-wrapper-fault.workspace = true
blake3.workspace = true
clap.workspace = true
memchr.workspace = true
memmap2.workspace = true
object.workspace = true
proc-macro2.workspace = true
rustc-demangle.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syn.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
# The campaign out-dir lock is a per-process `fcntl` record lock.
libc.workspace = true

[build-dependencies]
# build.rs packs the shim source bundle: `toml` normalizes each embedded
# manifest (resolving workspace inheritance so a crates.io/git checkout is a
# no-op path).
toml.workspace = true

[dev-dependencies]
libc.workspace = true
object.workspace = true
# A path-only dev-dependency (no `version`), so `cargo package` strips it: the
# unpublished conformance scenarios exist for the native_conformance test alone.
patina-dst-conformance = { path = "../patina-conformance" }
serde_json.workspace = true

[[bin]]
name = "cargo-patina"
path = "src/bin/cargo-patina.rs"
