[package]
name = "patina-dst"
description = "Patina's SDK: assertions, fault points and marks over one reserved system call"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# No dependencies, no build script: outside Patina every macro is a load and a branch, and on
# any target but Linux x86_64 the crate compiles to the inert path.

[features]
# The hooks of code rebuilt with LLVM's coverage pass (compute points; src/compute.rs). Off by
# default: a fuzzer's runtime defines the same symbols.
compute = []
