[package]
name = "patina"
description = "Patina cooperative-SUT SDK and public deterministic-execution facade"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# Default is the dependency-light cooperative-SUT SDK: the `buggify!`,
# `always!`, `sometimes!`, `reachable!`, and lifecycle macros plus
# `is_simulated`/`rng`. Outside a Patina build every macro compiles to a no-op or
# a plain fallback, so a plain `cargo build` of an adopter stays lightweight and
# warning-free and links no runtime.
default = []
# The explicit-boundary facade: `patina::run`/`run_with`, `Context`, the async
# `rt` module, and the ABI re-exports. Pulls in the runtime crates. Enable it in
# consumers that drive Patina through the explicit API.
runtime = ["dep:patina-abi", "dep:patina-async", "dep:patina-runtime"]

[dependencies]
patina-abi = { workspace = true, optional = true }
patina-async = { workspace = true, optional = true }
patina-runtime = { workspace = true, optional = true }

[dev-dependencies]
patina-net-sim.workspace = true
patina-wrapper-fault.workspace = true
patina-wrapper-latency.workspace = true
tempfile.workspace = true

# `cargo patina build` injects these cfgs workspace-wide; `patina_shim` is
# additionally injected only by the native `build` paths (which link the shim), so
# the SDK's shim FFI is referenced only where those symbols actually resolve.
# Declaring them here keeps `-D warnings` clean without affecting adopter crates.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(patina)',
    'cfg(dst)',
    'cfg(patina_shim)',
] }

[[example]]
name = "deterministic"
required-features = ["runtime"]

[[example]]
name = "simulation"
required-features = ["runtime"]
