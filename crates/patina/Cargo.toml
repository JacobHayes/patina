[package]
name = "patina-dst"
description = "Patina cooperative-SUT SDK and public deterministic-execution facade"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# The dependency-light cooperative-SUT SDK: the `buggify!`, `always!`,
# `sometimes!`, `reachable!`, and lifecycle macros plus `is_simulated`/`rng`.
# Outside a Patina build every macro compiles to a no-op or a plain fallback, so
# a plain `cargo build` of an adopter stays lightweight and warning-free and
# links no runtime. The explicit-context runtime surface lives in the separate
# `patina-dst-runtime` crate; this crate carries no optional runtime deps.
default = []

# `cargo patina build` injects these cfgs workspace-wide; `patina_shim` is
# additionally injected only by the native `build` paths (which link the shim), so
# the SDK's shim FFI is referenced only where those symbols actually resolve.
# Declaring them here keeps `-D warnings` clean without affecting adopter crates.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(patina)',
    'cfg(dst)',
    'cfg(patina_shim)',
] }
