[package]
name = "patina-dst"
description = "Patina cooperative-SUT SDK and public deterministic-execution facade"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# The dependency-light cooperative-SUT SDK: the `buggify!`, `always!`,
# `sometimes!`, `reachable!`, and lifecycle macros plus `is_simulated`/`rng`.
# Outside a Patina build every macro compiles to a no-op or a plain fallback, so
# a plain `cargo build` of an adopter stays lightweight and warning-free and
# links no runtime. The explicit-context runtime surface lives in the separate
# `patina-dst-runtime` crate; this crate carries no runtime deps.
default = []

# Test-only point-solution DST attribute. Keep this feature default-off so
# production builds of adopters do not compile the proc-macro crate.
macros = ["dep:patina-dst-macros"]

# Typed custom operations (`custom_op`). Default-off because it is the one part
# of this crate that pulls in a dependency: the encoding is SDK-owned (the shim
# ABI and the trace carry opaque bytes), and serde is how a typed value becomes
# those bytes. The untyped `custom_op_bytes` is always available, so a guest that
# already has bytes needs nothing extra.
custom-ops = ["dep:serde", "dep:serde_json"]

[dependencies]
patina-dst-macros = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# `cargo patina build` injects these cfgs workspace-wide; `patina_shim` is
# additionally injected only by the native `build` paths (which link the shim), so
# the SDK's shim FFI is referenced only where those symbols actually resolve.
# Declaring them here keeps `-D warnings` clean without affecting adopter crates.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(patina)',
    'cfg(dst)',
    'cfg(patina_shim)',
] }
