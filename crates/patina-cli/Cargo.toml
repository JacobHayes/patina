[package]
name = "patina-cli"
version.workspace = true
edition = "2021"
license.workspace = true
publish = false
description = "The patina binary: launcher, supervisor and log tools, with the runtime embedded"

[[bin]]
name = "patina"
path = "src/main.rs"

[dependencies]
proto = { package = "patina-proto", path = "../patina-proto" }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
sha2 = "0.11.1"
