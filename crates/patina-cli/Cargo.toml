[package]
name = "patina-cli"
version.workspace = true
edition = "2021"
license.workspace = true
publish = false
description = "The patina binary: launcher, supervisor and log tools, with the runtime embedded"

[[bin]]
name = "patina"
path = "src/main.rs"

[dependencies]
proto = { package = "patina-proto", path = "../patina-proto" }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
sha2 = "0.11.1"
# The compressed work trees a sweep keeps (`durability::kept`): pure Rust, as the static
# release binary needs.
ruzstd = "0.9.1"

# The load-time rewriter (`patina __rewrite`, src/rewrite/): x86_64 only, host side only. Decoding
# and the instruction facts it needs (flow control, flags read and written); no encoder,
# formatter or op-code tables.
[target.'cfg(target_arch = "x86_64")'.dependencies]
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "instr_info"] }
