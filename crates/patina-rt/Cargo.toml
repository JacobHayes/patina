[package]
name = "patina-rt"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "In-guest runtime: trap handler, loader, syscall handlers (no_std)"

[dependencies]
proto = { package = "patina-proto", path = "../patina-proto" }

# Built on its own for the host architecture's bare target, `x86_64-unknown-none` or
# `aarch64-unknown-none-softfloat` (patina-cli's build script, or `cargo build --release
# --target ...` here), not as a member of the root workspace: its own lock file and target.
[workspace]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
debug = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(patina_nolog)'] }
