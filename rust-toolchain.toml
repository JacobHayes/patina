# The repository's only Rust pin. rustup installs this toolchain, its components
# and targets on first use (or `rustup toolchain install`).
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = [
  "x86_64-unknown-linux-gnu",
  # The in-guest runtime (crates/patina-rt).
  "x86_64-unknown-none",
]
