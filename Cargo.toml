[workspace]
members = ["crates/patina-proto", "crates/patina-cli", "crates/patina"]
# The in-guest runtime is built for its own target by patina-cli's build script, with its own
# lock file. The examples are programs of their own, built with their own tools.
exclude = ["crates/patina-rt", "examples"]
resolver = "2"

# The supervisor must die on a panic, never unwind past a half-updated control region.
[profile.release]
panic = "abort"
debug = 1

# Our own arithmetic overflows stop the binary (and fail the unit tests, which run in release)
# instead of wrapping silently; intended wrapping is written `wrapping_*`.
[profile.release.package.patina-cli]
overflow-checks = true
[profile.release.package.patina-proto]
overflow-checks = true
[profile.release.package.patina-dst]
overflow-checks = true

[workspace.package]
version = "0.21.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/JacobHayes/patina"
