[workspace]
members = [
    "crates/cargo-patina",
    "crates/patina",
    "crates/patina-abi",
    "crates/patina-async",
    "crates/patina-conformance",
    "crates/patina-driver-api",
    "crates/patina-fs-crash",
    "crates/patina-fs-mem",
    "crates/patina-harness",
    "crates/patina-macros",
    "crates/patina-minimize",
    "crates/patina-native-shim",
    "crates/patina-net-sim",
    "crates/patina-rng-seeded",
    "crates/patina-runtime",
    "crates/patina-syscalls",
    "crates/patina-target",
    "crates/patina-trace",
    "crates/patina-wrapper-fault",
]
resolver = "2"

# Line tables are all the debug info this workspace uses: panic backtraces
# resolve file:line from them, and patina's own symbolization (coverage, stop
# diagnostics) reads the symbol table. Full debug info (types and variables,
# for an interactive debugger) made up most of every test binary: 230 MB of a
# 272 MB integration suite. Override locally with
# `CARGO_PROFILE_DEV_DEBUG=true` for a debugger session.
[profile.dev]
debug = "line-tables-only"

# `cargo test` builds the cargo-patina binary that the integration suites drive
# with the test profile, and the suites invoke it about a thousand times. Each
# call pushes the whole guest binary (tens of MB for a debug guest) through
# third-party code: `object` parses it, `memchr` searches it for markers, and a
# `build` hashes the shim archive (over 100 MB in debug) with `sha2`.
# Unoptimized, those dependencies cost about 2 s of CPU per `build` and 0.5 s
# per `run`. Third-party dependencies are optimized: they change only with
# Cargo.lock, so the dependency cache absorbs their compile time. `"*"` covers
# no workspace member, and one member is on that path too: patina-dst-target
# scans the guest binary before every `run`, `replay` and `audit`, which
# unoptimized costs about 0.5 s per call. With it optimized a call costs what
# it does with every workspace crate optimized. Debug assertions and overflow
# checks stay on; `cargo build` and `cargo run` (the dev profile) are
# unaffected.
[profile.test.package."*"]
opt-level = 3

[profile.test.package.patina-dst-target]
opt-level = 3

# The other workspace crates, among them the runtime, trace and filesystem
# crates the cargo-patina binary links, build at opt-level 1: the supervisor
# moves every recorded event through their generic code, which unoptimized
# costs seconds per large recording. cargo-patina itself, the crate an edit
# recompiles most, stays at opt-level 0, and so does the shim crate, whose unit
# tests are the only thing the test profile builds it for. Below opt-level 2 a
# crate reuses its dependencies' generic instantiations.
[profile.test]
opt-level = 1

[profile.test.package.cargo-patina]
opt-level = 0

[profile.test.package.patina-dst-native-shim]
opt-level = 0

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/JacobHayes/patina"

[workspace.dependencies]
# Internal path deps carry an explicit `version` alongside `path`: `cargo
# package`/`publish` requires a version requirement on every dependency (the
# path is stripped in the published manifest and the crates.io version is used).
# Keep these in lockstep with `workspace.package.version` above.
patina-dst = { path = "crates/patina", version = "0.1.0" }
patina-dst-abi = { path = "crates/patina-abi", version = "0.1.0" }
patina-dst-async = { path = "crates/patina-async", version = "0.1.0" }
patina-dst-driver-api = { path = "crates/patina-driver-api", version = "0.1.0" }
patina-dst-fs-crash = { path = "crates/patina-fs-crash", version = "0.1.0" }
patina-dst-fs-mem = { path = "crates/patina-fs-mem", version = "0.1.0" }
patina-dst-harness = { path = "crates/patina-harness", version = "0.1.0" }
patina-dst-macros = { path = "crates/patina-macros", version = "0.1.0" }
patina-dst-minimize = { path = "crates/patina-minimize", version = "0.1.0" }
patina-dst-native-shim = { path = "crates/patina-native-shim", version = "0.1.0" }
patina-dst-net-sim = { path = "crates/patina-net-sim", version = "0.1.0" }
patina-dst-rng-seeded = { path = "crates/patina-rng-seeded", version = "0.1.0" }
patina-dst-runtime = { path = "crates/patina-runtime", version = "0.1.0" }
patina-dst-syscalls = { path = "crates/patina-syscalls", version = "0.1.0" }
patina-dst-target = { path = "crates/patina-target", version = "0.1.0" }
patina-dst-trace = { path = "crates/patina-trace", version = "0.1.0" }
patina-dst-wrapper-fault = { path = "crates/patina-wrapper-fault", version = "0.1.0" }
# The CLI's token engine. Minor upgrades are deliberate because parser error
# wording is user-visible. Default features are off: the CLI renders its own
# help and usage from the flag registry, and `color` would make error output
# terminal-dependent, which a machine-parsed CLI must not be.
libc = "0.2.189"
clap = { version = "~4.6", default-features = false, features = ["std", "error-context", "suggestions", "env", "string"] }
# The Linux kernel's uapi constants for the target architecture: the native
# shim decodes the kernel ABI's flag words and errno values with them.
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["errno", "general", "no_std", "ptrace"] }
# The content address of the run cache: every run hashes the whole guest
# executable, so the hash must run at memory speed. `pure` keeps it to Rust
# (SSE4.1/AVX2 intrinsics on x86_64) so cross-target checks need no C toolchain.
blake3 = { version = "1.8.7", features = ["pure"] }
# The run maps the guest executable once rather than reading it per pass.
memmap2 = "0.9.11"
# Substring search for the instrumentation markers in guest binaries.
memchr = "2.8.3"
object = { version = "0.39.1", default-features = false, features = ["read", "std"] }
# Read ELF unwind ranges without implementing another DWARF pointer decoder.
gimli = { version = "0.32.3", default-features = false, features = ["read", "std"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
rustc-demangle = "0.1.26"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
syn = { version = "2.0.119", features = ["full", "visit"] }
tempfile = "3.27.0"
toml = "0.8"
