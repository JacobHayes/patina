[workspace]
members = ["crates/patina-proto", "crates/patina-cli"]
# The in-guest runtime is built for its own target by patina-cli's build script, with its own
# lock file. The SDK and the documented examples are not built on this branch yet.
exclude = ["crates/patina-rt", "crates/patina", "examples"]
resolver = "2"

# The supervisor must die on a panic, never unwind past a half-updated control region.
[profile.release]
panic = "abort"
debug = 1

[workspace.package]
version = "0.6.0-dev"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/JacobHayes/patina"
