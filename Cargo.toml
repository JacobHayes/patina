[workspace]
members = [
    "crates/cargo-patina",
    "crates/patina",
    "crates/patina-abi",
    "crates/patina-async",
    "crates/patina-bench",
    "crates/patina-driver-api",
    "crates/patina-fs-crash",
    "crates/patina-fs-host",
    "crates/patina-fs-mem",
    "crates/patina-minimize",
    "crates/patina-native-shim",
    "crates/patina-net-sim",
    "crates/patina-proptest",
    "crates/patina-rng-seeded",
    "crates/patina-runtime",
    "crates/patina-sched-det",
    "crates/patina-target",
    "crates/patina-time-virtual",
    "crates/patina-trace",
    "crates/patina-wasi-host",
    "crates/patina-wrapper-fault",
    "crates/patina-wrapper-latency",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.86"
repository = "https://github.com/JacobHayes/patina"

[workspace.dependencies]
patina-dst = { path = "crates/patina" }
patina-dst-abi = { path = "crates/patina-abi" }
patina-dst-async = { path = "crates/patina-async" }
patina-dst-driver-api = { path = "crates/patina-driver-api" }
patina-dst-fs-crash = { path = "crates/patina-fs-crash" }
patina-dst-fs-host = { path = "crates/patina-fs-host" }
patina-dst-fs-mem = { path = "crates/patina-fs-mem" }
patina-dst-minimize = { path = "crates/patina-minimize" }
patina-dst-native-shim = { path = "crates/patina-native-shim" }
patina-dst-net-sim = { path = "crates/patina-net-sim" }
patina-dst-proptest = { path = "crates/patina-proptest" }
patina-dst-rng-seeded = { path = "crates/patina-rng-seeded" }
patina-dst-runtime = { path = "crates/patina-runtime" }
patina-dst-sched-det = { path = "crates/patina-sched-det" }
patina-dst-target = { path = "crates/patina-target" }
patina-dst-time-virtual = { path = "crates/patina-time-virtual" }
patina-dst-trace = { path = "crates/patina-trace" }
patina-dst-wasi-host = { path = "crates/patina-wasi-host" }
patina-dst-wrapper-fault = { path = "crates/patina-wrapper-fault" }
patina-dst-wrapper-latency = { path = "crates/patina-wrapper-latency" }
object = { version = "0.39.1", default-features = false, features = ["read", "std"] }
proptest = { version = "1.11.0", default-features = false, features = ["std", "bit-set"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
wasmi = "1.1.0"
wasmparser = "0.254.0"
wat = "1.254.0"
