# Local root-workspace setup for Patina.
#
# This intentionally covers only the main workspace and core validation scripts.
# Heavy standalone testbeds keep their own setup and are not required for
# ordinary local development.

[settings]
# Lock every configured tool, including tools added later.
lockfile = true

[env]
# rust-toolchain.toml is the Rust pin. Export its channel so a global mise Rust
# cannot override it, and so a cargo started without rustup's proxy (nextest
# runs one) still compiles dependencies, whose directories hold no toolchain
# file, with the pin rather than rustup's default.
RUSTUP_TOOLCHAIN = '''{{ exec(command=`awk -F'"' '/^channel/ {print $2}' rust-toolchain.toml`) }}'''

[tools]
ast-grep = "0.45.3"
# The workspace test runner, locally (scripts/check.sh) and in CI.
"github:nextest-rs/nextest" = { version = "0.9.148", version_prefix = "cargo-nextest-" }

# mise can't hide a passing rung's output while replaying a failed rung's
# complete log, so a small shell runner does.
[tasks.check]
description = "Full local pre-landing validation (audit-corpus runs in CI/final gates)"
run = "scripts/check.sh"

[tasks."check:native-abi"]
description = "Targetable native ABI feedback, without the full landing battery"
run = "cargo test -p cargo-patina --test native_abi --locked"

[tasks.smoke]
description = "Run core Patina native smoke checks"
run = [
  "cargo test -p cargo-patina --test native_abi --test native_containment --test native_raw --test native_signals --test native_trace --test native_workloads --locked",
  "scripts/smoke-native.sh",
]

[tasks.bench]
description = "Native-versus-Patina overhead benchmark over halting workloads (measurement, not a gate)"
run = "python3 -B scripts/bench.py"

[tasks."bench:guided"]
description = "Paired guided-versus-uniform campaign benchmark: generations to a planted bug over many seed bases (measurement, not a gate)"
run = "python3 -B scripts/guided-bench.py"

[tasks."audit-corpus"]
description = "Ecosystem symbol-audit corpus: build+audit 20 MREs, strict-xfail vs committed per-platform expectations"
run = "testbeds/audit-corpus/run.sh"

[tasks.conformance]
description = "Syscall conformance: every scenario natively (the live host oracle) and under patina through the libc and syscall doors (raw only where the trap is the subject), record/replay on one leg per scenario, strace leak run on every leg"
run = "cargo test -p cargo-patina --test native_conformance --locked"

[tasks."conformance:coverage"]
description = "List registry entries no conformance scenario covers and no exclusion accounts for; exits 1 while any remain"
run = "cargo run -q -p patina-dst-conformance --bin conformance-coverage --locked"

