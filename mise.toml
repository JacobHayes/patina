# Local root-workspace setup for Patina: the pinned tools and the task names.

[settings]
# Lock every configured tool, including tools added later.
lockfile = true

[env]
# rust-toolchain.toml is the Rust pin. Export its channel so a global mise Rust
# cannot override it, and so the guests' own cargo builds (tests/guests) use the pin.
RUSTUP_TOOLCHAIN = '''{{ exec(command=`awk -F'"' '/^channel/ {print $2}' rust-toolchain.toml`) }}'''

[tools]
# The Go guests under tests/guests are built with the stock toolchain; their go.mod files
# name this version.
go = "1.27.3"
# scripts/land and its test (tests/scripts) use jj.
jj = "0.47.1"

# The landing gate, locally and in CI.
[tasks.check]
description = "The landing gate: format, clippy, then ./check quick"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  # The SDK's off-by-default feature: the compute-point hooks.
  "cargo clippy -p patina-dst --all-targets --features compute --locked -- -D warnings",
  # The runtime is its own workspace, built for a bare target per architecture: both are
  # linted on every host.
  "cd crates/patina-rt && cargo fmt -- --check && cargo clippy --release --locked --target x86_64-unknown-none -- -D warnings && cargo clippy --release --locked --target aarch64-unknown-none-softfloat -- -D warnings",
  # Wall-clock assertions, fixed sleeps and pinned seeds in the gate's scripts.
  "python3 -I tests/lint.py",
  "./check quick",
]
