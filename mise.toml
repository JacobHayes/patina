# Local root-workspace setup for Patina.
#
# This intentionally covers only the main workspace and core validation scripts.
# Heavy standalone testbeds keep their own setup and are not required for
# ordinary local development.

# mise.lock is lockfile version 3. Older mise warns that it can't read it, then
# silently resolves `rust = "latest"` to whatever is installed; refuse instead.
min_version = "2026.9.18"

[settings]
# Lock every configured tool, including tools added later.
lockfile = true

[tools]
# The selector follows releases only when mise.lock is deliberately refreshed.
rust = "latest"

[tasks.setup]
description = "Install the pinned root-workspace Rust toolchain, components and targets"
run = """
#!/usr/bin/env bash
set -euo pipefail
python3 - <<'PYTHON'
import subprocess
import tomllib
from pathlib import Path

# Keep components and cross-target std libraries in the rustup-facing file.
toolchain = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]
# Register an existing rustup install with mise too. This repairs older mise
# Rust symlink registries that otherwise resolve `latest` from installed tools.
subprocess.run(["mise", "install", "rust@" + toolchain["channel"]], check=True)
args = ["rustup", "toolchain", "install", toolchain["channel"], "--profile", toolchain["profile"]]
for component in toolchain["components"]:
    args.extend(["--component", component])
for target in toolchain["targets"]:
    args.extend(["--target", target])
subprocess.run(args, check=True)
PYTHON
cc --version >/dev/null
echo "Patina local toolchain is ready."
"""

# The check runner keeps cheap, high-signal failures serial, runs only measured
# overlap groups concurrently, retains per-rung timings in logs, hides successful
# command chatter, and replays complete failure logs. That last failure-log
# contract is the mise feature gap that keeps the small shell runner in place.
[tasks.check]
description = "Full local pre-landing validation (audit-corpus runs in CI/final gates)"
run = "scripts/check.sh full"

# Inner-loop tier: fmt, the four clippy passes, all workspace tests except the
# cargo-patina end_to_end and native execution targets (conformance included),
# cheap selftests, flag and toolchain drift, WASI validation, and
# cross-target smoke.
[tasks."check:fast"]
description = "Fast iteration tier of `check`; not sufficient for landing"
run = "scripts/check.sh fast"

[tasks."check:native-abi"]
description = "Targetable native ABI feedback, without the full landing battery"
run = "cargo test -p cargo-patina --test native_abi --locked"

[tasks.smoke]
description = "Run core Patina native, WASI, and cross-target checks"
run = [
  "scripts/validate-wasi.sh",
  "cargo test -p cargo-patina --test native_abi --test native_containment --test native_raw --test native_signals --test native_trace --test native_workloads --test shim_host_alias --locked",
  "scripts/check-native-testbeds.sh",
  "scripts/smoke-cross-target.sh",
]

[tasks.bench]
description = "Native-versus-Patina overhead benchmark over halting workloads (measurement, not a gate)"
run = "python3 -B scripts/bench.py"

[tasks."audit-corpus"]
description = "Ecosystem symbol-audit corpus: build+audit 20 MREs, strict-xfail vs committed per-platform expectations"
run = "testbeds/audit-corpus/run.sh"

[tasks.conformance]
description = "Syscall conformance: every scenario natively (the live host oracle) and under patina through every vehicle, record/replay, strace leak run"
run = "cargo test -p cargo-patina --test native_conformance --locked"

[tasks."conformance:coverage"]
description = "List registry entries no conformance scenario covers and no exclusion accounts for; exits 1 while any remain"
run = "cargo run -q -p patina-dst-conformance --bin conformance-coverage --locked"

[tasks.demo]
description = "Run the explicit-context vertical-slice demo"
run = '''
set -euo pipefail
cargo build -p cargo-patina
export PATH="$PWD/target/debug:$PATH"
rm -f /tmp/demo.patina
cargo patina run -p patina-dst-runtime --example deterministic --seed 123
cargo patina run -p patina-dst-runtime --example deterministic --seed 123 --record /tmp/demo.patina
cargo patina replay . /tmp/demo.patina -p patina-dst-runtime --example deterministic
cargo patina replay . /tmp/demo.patina -p patina-dst-runtime --example deterministic --branch --from 1 --branch-seed 456 --branch-id branch-456
cargo patina replay . /tmp/demo.patina -p patina-dst-runtime --example deterministic --timeline branch-456
cargo patina run -p patina-dst-runtime --example simulation --seed 321
cargo patina explore run --seeds 10 -p patina-dst-runtime --example deterministic
'''
