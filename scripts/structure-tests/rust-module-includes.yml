{
  "id": "rust-module-includes",
  "valid": [
    "mod owned;",
    "include_str!(\"guest.rs\");",
    "fixture!(\"include!(\\\"../evil.rs\\\");\");"
  ],
  "invalid": [
    "include!(\"owned.rs\");",
    "include!(\"../evil.rs\");",
    "include!(concat!(env!(\"CARGO_MANIFEST_DIR\"), \"/../../evil.rs\"));",
    "std::include!(\"../../../escape.rs\");",
    "use std::include as load;",
    "use std::{include as load};",
    "std::r#include!(\"../evil.rs\");",
    "use std::r#include as load;"
  ]
}
