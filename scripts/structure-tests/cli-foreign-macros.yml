{
  "id": "cli-foreign-macros",
  "valid": [
    "macro_rules! safe { () => { fn open64() {} }; }",
    "format!(r#\"unsafe extern \"C\" {{ fn open64(path: *const u8, flags: i32) -> i32; }}\"#);",
    "format!(r#\"#[link_name = \"open64\"] fn alias();\"#);"
  ],
  "invalid": [
    "macro_rules! imports { () => { unsafe extern \"C\" { fn open64(arg: i32) -> i32; } }; }",
    "imports!(unsafe extern \"C\" { fn open64(arg: i32) -> i32; });",
    "macro_rules! imports { ($name:ident) => { unsafe extern \"C\" { fn $name(arg: i32) -> i32; } }; }",
    "macro_rules! imports { ($abi:ident) => { unsafe $abi \"C\" { fn open64(arg: i32) -> i32; } }; } imports!(extern);",
    "imports!(#[cfg_attr(unix, unsafe(link_name = \"open64\"))] fn alias(arg: i32) -> i32;);",
    "macro_rules! imports { () => { unsafe /* comment */ extern /* comment */ \"C\" { fn open64(arg: i32) -> i32; } }; }",
    "macro_rules! bad { () => { #[r#link_name=\"open64\"] fn bad(); }; }"
  ]
}
