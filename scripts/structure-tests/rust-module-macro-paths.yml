{
  "id": "rust-module-macro-paths",
  "valid": [
    "macro_rules! fixture { () => { \"include!(\\\"../evil.rs\\\"); #[path=\\\"../evil.rs\\\"] mod evil;\" }; }",
    "fixture!(\"include!(\\\"../evil.rs\\\");\");",
    "include!(\"owned.rs\");",
    "format!(\"path={}\", value);",
    "macro_rules! fixture { () => { \"mod\" }; }"
  ],
  "invalid": [
    "macro_rules! escape { () => { include!(\"../evil.rs\"); }; }",
    "macro_rules! escape { () => { #[path=\"owned.rs\"] mod evil; }; }",
    "escape! { #[path=\"../evil.rs\"] mod evil; }",
    "escape! { include!(\"../evil.rs\"); }",
    "macro_rules! escape { ($attr:ident, $p:literal) => { #[$attr=$p] mod evil; }; }",
    "escape! { mod evil; }",
    "std::include!(\"../../../escape.rs\");",
    "std::r#include!(\"../evil.rs\");",
    "macro_rules! escape { () => { #[r#path /* comment */ = \"evil.rs\"] mod evil; }; }"
  ]
}
