{
  "id": "sdk-site-export-generators",
  "valid": [
    "macro_rules! ordinary { () => { () }; }",
    "macro_rules! quoted_fixture { () => { \"#[macro_export] macro_rules! guest {}\" }; }"
  ],
  "invalid": [
    "macro_rules! another { () => { #[macro_export] macro_rules! added { () => { () }; } }; }",
    "macro_rules! another { () => { #[cfg_attr(any(), macro_export)] macro_rules! added { () => { () }; } }; }",
    "macro_rules! another { () => { #[r#macro_export] macro_rules! added { () => { () }; } }; }"
  ]
}
