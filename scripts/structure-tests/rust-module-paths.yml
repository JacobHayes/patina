{
  "id": "rust-module-paths",
  "valid": [
    "#[path=\"review_outside.rs\"] mod outside;",
    "#[path=\"dir/owned.rs\"] mod owned;",
    "#[cfg_attr(unix, path=\"dir/owned.rs\")] mod owned;",
    "#[path=r#\"dir/owned.rs\"#] mod owned;",
    "const FIXTURE: &str = \"#[path=\\\"../../evil.rs\\\"] mod evil;\";",
    "#[doc = \"path=\\\"../../evil.rs\\\"\"] mod ordinary;",
    "#[path /* hi */ = /* hi */ \"owned.rs\"] mod owned;",
    "#[cfg_attr(any(), path /* hi */ = /* hi */ \"owned.rs\")] mod owned;",
    "mod ordinary;"
  ],
  "invalid": [
    "#[path=\"../review_outside.rs\"] mod outside;",
    "#[path=\"dir/../../evil.rs\"] mod outside;",
    "#[path=\"/outside.rs\"] mod outside;",
    "#[path=\"target/generated.rs\"] mod outside;",
    "#[path=\"dir/target/generated.rs\"] mod outside;",
    "#[path=\"owned.txt\"] mod outside;",
    "#[path=\"\\x2e\\x2e/outside.rs\"] mod outside;",
    "#[cfg_attr(unix, path=\"../../evil.rs\")] mod outside;",
    "#[path=r#\"../evil.rs\"#] mod outside;",
    "#[path /* hi */ = \"../../../escape.rs\"] mod escaped;",
    "#[path = /* hi */ \"../../../escape.rs\"] mod escaped;",
    "#[cfg_attr(any(), path /* hi */ = /* hi */ \"../../../escape.rs\")] mod escaped;",
    "#[r#path /* comment */ = \"../evil.rs\"] mod escaped;",
    "mod target;",
    "mod r#target;"
  ]
}
