id: shim-abi-entry
valid:
  - |
    #[unsafe(no_mangle)]
    pub extern "C" fn guarded() {
        // The guard must precede executable statements, not comments.
        let _panic_scope = crate::panic_boundary::PanicScope::enter();
        work();
    }
  - |
    #[unsafe(no_mangle)]
    pub extern "C" fn glue() {
        let _panic_scope = crate::panic_boundary::PanicScope::enter_glue();
        work();
    }
  - |
    #[unsafe(no_mangle)]
    pub extern "C" fn classed() {
        let _panic_scope = crate::panic_boundary::PanicScope::enter_op(crate::charge::Op::ClockRead);
        work();
    }
invalid:
  - |
    #[unsafe(no_mangle)]
    pub extern "C" fn unguarded() { work(); }
