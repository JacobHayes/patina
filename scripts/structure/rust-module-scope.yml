# Scan every Rust file under crates/testbeds, including build scripts, examples
# and modules outside src. Parent/absolute/encoded paths and arbitrary executable
# includes cannot reach source outside this linted tree. The two OUT_DIR includes
# contain generated data tables, not implementation modules. Fixture strings are
# data: token-level matching does not mistake them for module directives.
{
  "id": "rust-module-paths",
  "language": "Rust",
  "severity": "error",
  "message": "Module paths must stay in the linted source tree: use simple relative .rs paths without parent, encoded or target components.",
  "files": [
    "crates/**/*.rs",
    "testbeds/**/*.rs"
  ],
  "ignores": [
    "**/target/**"
  ],
  "rule": {
    "any": [
      {
        "all": [
          {
            "kind": "identifier"
          },
          {
            "regex": "^(r#)?path$"
          },
          {
            "inside": {
              "kind": "attribute_item",
              "stopBy": "end"
            }
          },
          {
            "precedes": {
              "regex": "^=$",
              "stopBy": {
                "not": {
                  "any": [
                    {
                      "kind": "line_comment"
                    },
                    {
                      "kind": "block_comment"
                    }
                  ]
                }
              }
            }
          },
          {
            "not": {
              "precedes": {
                "all": [
                  {
                    "any": [
                      {
                        "kind": "string_literal"
                      },
                      {
                        "kind": "raw_string_literal"
                      }
                    ]
                  },
                  {
                    "regex": "^(\"[A-Za-z0-9_-][A-Za-z0-9_.-]*(/[A-Za-z0-9_-][A-Za-z0-9_.-]*)*\\.rs\"|r#*\"[A-Za-z0-9_-][A-Za-z0-9_.-]*(/[A-Za-z0-9_-][A-Za-z0-9_.-]*)*\\.rs\"#*)$"
                  },
                  {
                    "not": {
                      "regex": "(\"|/)target/"
                    }
                  }
                ],
                "stopBy": {
                  "not": {
                    "any": [
                      {
                        "regex": "^=$"
                      },
                      {
                        "kind": "line_comment"
                      },
                      {
                        "kind": "block_comment"
                      }
                    ]
                  }
                }
              }
            }
          }
        ]
      },
      {
        "all": [
          {
            "kind": "mod_item"
          },
          {
            "has": {
              "field": "name",
              "regex": "^(r#)?target$"
            }
          }
        ]
      }
    ]
  }
}
---
{
  "id": "rust-module-includes",
  "language": "Rust",
  "severity": "error",
  "message": "Executable include! is forbidden outside the two owned generated-data table sites.",
  "files": [
    "crates/**/*.rs",
    "testbeds/**/*.rs"
  ],
  "ignores": [
    "**/target/**",
    "crates/cargo-patina/src/shim_build.rs",
    "crates/patina-native-shim/src/bundle.rs"
  ],
  "rule": {
    "any": [
      {
        "all": [
          {
            "kind": "macro_invocation"
          },
          {
            "has": {
              "field": "macro",
              "regex": "(^|::)(r#)?include$"
            }
          }
        ]
      },
      {
        "all": [
          {
            "kind": "use_declaration"
          },
          {
            "has": {
              "kind": "identifier",
              "regex": "^(r#)?include$",
              "stopBy": "end"
            }
          }
        ]
      }
    ]
  }
}
---
{
  "id": "rust-module-generated-includes",
  "language": "Rust",
  "severity": "error",
  "message": "Owned include sites may include only the exact generated-data table expressions.",
  "files": [
    "crates/cargo-patina/src/shim_build.rs",
    "crates/patina-native-shim/src/bundle.rs"
  ],
  "ignores": [
    "**/target/**"
  ],
  "rule": {
    "any": [
      {
        "all": [
          {
            "all": [
              {
                "kind": "macro_invocation"
              },
              {
                "has": {
                  "field": "macro",
                  "regex": "(^|::)(r#)?include$"
                }
              }
            ]
          },
          {
            "not": {
              "any": [
                {
                  "pattern": "include!(concat!(env!(\"OUT_DIR\"), \"/shim_sources.rs\"))"
                },
                {
                  "pattern": "include!(concat!(env!(\"OUT_DIR\"), \"/posix_sources.rs\"))"
                }
              ]
            }
          }
        ]
      },
      {
        "all": [
          {
            "kind": "use_declaration"
          },
          {
            "has": {
              "kind": "identifier",
              "regex": "^(r#)?include$",
              "stopBy": "end"
            }
          }
        ]
      }
    ]
  }
}
---
{
  "id": "rust-module-macro-paths",
  "language": "Rust",
  "severity": "error",
  "message": "Macros may not hide module declarations, path attributes or executable include tokens; declare owned modules directly.",
  "files": [
    "crates/**/*.rs",
    "testbeds/**/*.rs"
  ],
  "ignores": [
    "**/target/**"
  ],
  "rule": {
    "all": [
      {
        "any": [
          {
            "kind": "macro_definition"
          },
          {
            "kind": "macro_invocation"
          }
        ]
      },
      {
        "not": {
          "all": [
            {
              "kind": "macro_invocation"
            },
            {
              "has": {
                "field": "macro",
                "regex": "^include$"
              }
            }
          ]
        }
      },
      {
        "has": {
          "any": [
            {
              "all": [
                {
                  "kind": "identifier"
                },
                {
                  "regex": "^(r#)?include$"
                }
              ]
            },
            {
              "all": [
                {
                  "kind": "identifier"
                },
                {
                  "regex": "^(r#)?path$"
                },
                {
                  "precedes": {
                    "regex": "^=$",
                    "stopBy": {
                      "not": {
                        "any": [
                          {
                            "kind": "line_comment"
                          },
                          {
                            "kind": "block_comment"
                          }
                        ]
                      }
                    }
                  }
                }
              ]
            },
            {
              "all": [
                {
                  "regex": "^mod$"
                },
                {
                  "not": {
                    "kind": "string_content"
                  }
                }
              ]
            }
          ],
          "stopBy": "end"
        }
      }
    ]
  }
}
