id: shim-system-headers
language: C
severity: error
message: Shared system headers belong in the first family, posix/core.c.
files:
  - crates/patina-native-shim/**/*.c
ignores:
  - crates/patina-native-shim/c/posix/core.c
  - '**/target/**'
rule:
  all:
    - kind: preproc_include
    # A macro-selected header could expand to a system header. Only literal
    # quoted project headers are safe outside the owning first family.
    - not:
        has:
          kind: string_literal
