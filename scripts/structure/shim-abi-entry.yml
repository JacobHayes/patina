id: shim-abi-entry
language: Rust
severity: error
message: Shim exports must enter PanicScope first and retain it until return.
files:
  - crates/patina-native-shim/**/*.rs
ignores:
  - '**/target/**'
rule:
  all:
    - kind: function_item
    - any:
        - follows:
            all:
              - kind: attribute_item
              - has:
                  kind: identifier
                  regex: '^(r#)?(no_mangle|export_name)$'
                  stopBy: end
            stopBy:
              not:
                any:
                  - kind: attribute_item
                  - kind: line_comment
                  - kind: block_comment
        - all:
            - has:
                kind: visibility_modifier
            - has:
                kind: function_modifiers
                has:
                  kind: extern_modifier
                  any:
                    - has:
                        kind: string_literal
                        regex: '^"C(-unwind)?"$'
                    - not:
                        has:
                          kind: string_literal
    # These implement panic/stack ownership; __real_dlsym is a test resolver.
    - not:
        has:
          field: name
          regex: '^(patina_abort|patina_trap_enter|patina_trap_leave|patina_note_guest_sp|__real_dlsym)$'
    - any:
        - not:
            has:
              field: body
              has:
                all:
                  - pattern: 'let _panic_scope = crate::panic_boundary::PanicScope::enter();'
                  - not:
                      follows:
                        all:
                          - not:
                              any:
                                - kind: line_comment
                                - kind: block_comment
                          - not:
                              regex: '^[{}]$'
                        stopBy: end
        # An otherwise correct entry must not drop, move or shadow its guard.
        - has:
            field: body
            has:
              all:
                - kind: identifier
                - regex: '^_panic_scope$'
                - not:
                    inside:
                      pattern: 'let _panic_scope = crate::panic_boundary::PanicScope::enter();'
                      stopBy: neighbor
              stopBy: end
