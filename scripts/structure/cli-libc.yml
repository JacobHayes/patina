# Audited libc C-variadic inventory for Linux and Darwin: open/openat and
# fcntl large-file/internal/nocancel aliases; ioctl/syscall; exec-list calls;
# stdio/wide output/input, fortify, ISO scanf and long-double aliases; logging
# and error/argp reporting; monetary formatting; sem/mq/shm creation; process
# control, ulimit and makecontext. Darwin protected-open variants are included.
# Audit sources: libc 0.2.189 Unix declarations; glibc headers and static
# same-entrypoint aliases (including exact ldbl/IEEE128 redirects); the shim's
# exported open/fcntl aliases; Apple sys/fcntl.h, xlocale and extensible printf
# declarations. The inventory lives in policy.json. The symbol registry records routing/status
# but has no variadic ABI metadata, so it cannot generate this inventory.
# Fixed *_open*_2 wrappers and v* printf/scanf APIs taking va_list are excluded.
id: cli-libc-declarations
language: Rust
severity: error
message: Use the shared ABI-checked variadic libc binding in cargo-patina/src/lib.rs.
files:
  - crates/cargo-patina/**/*.rs
ignores:
  - crates/cargo-patina/src/lib.rs
  - crates/cargo-patina/**/target/**
rule:
  all:
    - kind: function_signature_item
    - has:
        field: name
        regex: '^(r#)?({{libc_variadic_names}})$'
    - inside:
        kind: foreign_mod_item
        stopBy: end
---
id: cli-root-libc-declarations
language: Rust
severity: error
message: Only the shared ABI-checked fcntl and prctl declarations are sanctioned; new variadic libc bindings need an ABI type check and an explicit policy decision.
files:
  - crates/cargo-patina/src/lib.rs
rule:
  all:
    - kind: function_signature_item
    - has:
        field: name
        regex: '^(r#)?({{libc_variadic_names}})$'
    - inside:
        kind: foreign_mod_item
        stopBy: end
    - not:
        any:
          - pattern: 'fn fcntl(fd: i32, cmd: i32, ...) -> i32;'
          - pattern: 'fn prctl(option: std::ffi::c_int, ...) -> std::ffi::c_int;'

---
id: cli-libc-alias-declarations
language: Rust
severity: error
message: Import the shared libc declaration; link_name aliases cannot redefine its ABI.
files:
  - crates/cargo-patina/**/*.rs
ignores:
  - crates/cargo-patina/**/target/**
# Inspect nested metadata too: cfg_attr and unsafe(link_name) are token trees.
# Comments between the name, equals sign and literal do not change the match.
rule:
  all:
    - kind: attribute_item
    - has:
        kind: identifier
        regex: '^(r#)?link_name$'
        stopBy: end
    - any:
        - has:
            any:
              - kind: string_literal
              - kind: raw_string_literal
            regex: '^("({{libc_variadic_names}})(\$(NOCANCEL|UNIX2003|DARWIN_EXTSN|INODE64))*"|r#*"({{libc_variadic_names}})(\$(NOCANCEL|UNIX2003|DARWIN_EXTSN|INODE64))*"#*)$'
            stopBy: end
        # Require canonical literal symbol spellings: encoded strings or
        # attribute macros must not hide a variadic name from the inventory.
        - has:
            all:
              - kind: identifier
              - regex: '^(r#)?link_name$'
              - precedes:
                  regex: '^=$'
                  stopBy:
                    not:
                      any:
                        - kind: line_comment
                        - kind: block_comment
              - not:
                  precedes:
                    all:
                      - any:
                          - kind: string_literal
                          - kind: raw_string_literal
                      - regex: '^("[A-Za-z_][A-Za-z0-9_$]*"|r#*"[A-Za-z_][A-Za-z0-9_$]*"#*)$'
                    stopBy:
                      not:
                        any:
                          - regex: '^=$'
                          - kind: line_comment
                          - kind: block_comment
            stopBy: end
---
id: cli-foreign-macros
language: Rust
severity: error
message: Declare foreign bindings directly at the shared ABI-checked site; macros may not generate extern or link_name tokens.
files:
  - crates/cargo-patina/**/*.rs
ignores:
  - crates/cargo-patina/**/target/**
# Foreign declarations inside macro token trees are opaque to function-item
# rules. Close both the definition and invocation paths by forbidding the Rust
# tokens that create them. String literals remain data, so embedded guest
# source and format strings are unaffected.
rule:
  all:
    - any:
        - kind: macro_definition
        - kind: macro_invocation
    - has:
        kind: identifier
        regex: '^(r#)?(extern|link_name)$'
        stopBy: end
