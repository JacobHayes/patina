name: Set up pinned tools
description: Install the rust-toolchain.toml toolchain and the locked mise tools
runs:
  using: composite
  steps:
    # rustup reads the channel, components and targets from rust-toolchain.toml.
    # Install all of it here: a component left to install lazily races between
    # concurrent rustc invocations.
    - shell: bash
      run: |
        rustup toolchain install
        rustup component list --installed
    # The action caches mise's installs under a key it derives from the mise
    # version and config, so the cache always matches what is installed.
    - uses: jdx/mise-action@v3
      with:
        version: 2026.10.17
        install_args: --locked
