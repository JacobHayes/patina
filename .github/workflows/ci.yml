name: CI

on:
  pull_request:
  push:
    # ci/** lets a pushed branch run the routine Linux matrix without opening
    # a PR (used for iterating on Linux-only behavior from macOS).
    branches: [main, "ci/**"]
  # The heavy randomized workq campaign runs nightly on Linux, alongside one
  # pinned macOS safety-net run. Ordinary pushes rely on the
  # developer's full local macOS landing gate and spend hosted-runner time on
  # the Linux platforms unavailable locally.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      bench_only:
        description: Run only the overhead benchmark (the bench job)
        type: boolean
        default: false

# Per event as well as per ref: the scheduled run and a push to main run
# different jobs, so neither may cancel the other. A newer push cancels a
# branch or PR run, never a main run: main's runs save the caches every other
# run restores.
#
# A push to main runs only the `cache-*` jobs. Main only fast-forwards to a
# commit whose branch run passed, so testing it again adds no signal; but
# GitHub scopes a cache to the ref that saved it, and only main's caches reach
# every branch, so main still builds what the branch jobs restore.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only unless a job asks for more (only bench-publish does).
permissions:
  contents: read

jobs:
  # Each branch/PR/dispatch row (the pinned toolchain on both Linux
  # architectures) is split into parallel jobs so wall time is the longest
  # slice, not the sum: `tests` runs the complete workspace suite in four
  # nextest partitions, and `gates` runs every other check of the row.
  tests:
    if: github.event_name != 'schedule' && !inputs.bench_only && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: Rust / ${{ matrix.runner }} / tests ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and aarch64 Linux surface different platform gaps (libgcc
        # split-stack wrap symbols exist only on x86; the dev VM is aarch64).
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.runner }}
    env:
      PATINA_REQUIRE_SUD: ${{ matrix.runner == 'ubuntu-latest' && '1' || '0' }}
      # Every syscall conformance scenario must find the runner an oracle
      # (covered rows present, needed capabilities present); rows past the
      # virtual ABI that a newer runner kernel implements answer their declared
      # ENOSYS natively instead. The runners' kernel is off the pinned 6.8, so
      # the native-versus-patina comparison only reports there (DIVERGES lines,
      # a step-summary section); PATINA_REQUIRE_PINNED_KERNEL=1 would fail it.
      PATINA_REQUIRE_HOST_ORACLE: '1'
      # strace is the Linux whole-run syscall-containment class detector
      # (native_trace, and the conformance scenarios' leak run). It is installed
      # below and required, so a runner image without strace hard-fails instead
      # of silently dropping the containment gate.
      PATINA_REQUIRE_STRACE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      # The key covers the root manifest's [profile] tables (the whole root
      # Cargo.toml), which change what every crate compiles to.
      # The partitions build identical artifacts, which `cache` saves from
      # main under the same shared key; branch and PR runs only restore.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-${{ hashFiles('mise.lock', 'rust-toolchain.toml', 'Cargo.toml') }}
          save-if: false
      - run: sudo apt-get update && sudo apt-get install -y strace && uname -r
      # The oracle host's scenario prerequisites, on record for when a need
      # goes unmet: network (IPv6 on lo, fanotify groups, non-local binds) and
      # privileged (perf, BPF, userfaultfd, Yama, user namespaces, Landlock).
      # Each key is read on its own, so a kernel without one still logs the rest.
      - run: |
          for key in net.ipv6.conf.lo.disable_ipv6 net.ipv4.ip_nonlocal_bind net.ipv6.ip_nonlocal_bind \
              kernel.perf_event_paranoid kernel.unprivileged_bpf_disabled vm.unprivileged_userfaultfd \
              kernel.yama.ptrace_scope kernel.apparmor_restrict_unprivileged_userns; do
            sysctl "$key" || echo "$key: absent"
          done
          cat /proc/sys/fs/fanotify/max_user_groups || true
          echo "lsm: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unreadable)"
          python3 -c 'import ctypes; r = ctypes.CDLL(None, use_errno=True).syscall(444, None, 0, 1); print("landlock ABI:", r if r > 0 else "unavailable (errno %d)" % ctypes.get_errno())' || true
      # The complete workspace suite, split across the two partitions by test
      # name (nextest runs every test binary; doctests run separately below).
      # Rust executes it on each Linux platform, the syscall conformance
      # scenarios (native_conformance) included; x86_64 also runs their raw
      # vehicle under SUD. Nested
      # Patina shim caches are compiler-identity keyed. Off the pinned kernel
      # the conformance comparison only reports (to this step's job summary),
      # and nextest hides a passing test's stderr, so the summary is repeated
      # in the log.
      - run: |
          status=0
          cargo nextest run --profile ci --workspace --locked --partition hash:${{ matrix.shard }}/4 || status=$?
          if [ -s "$GITHUB_STEP_SUMMARY" ]; then cat "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
      - if: matrix.shard == 1
        run: cargo test --workspace --doc --locked
      - if: matrix.shard == 1
        run: cargo test -p patina-dst --features macros --locked

  gates:
    if: github.event_name != 'schedule' && !inputs.bench_only && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: Rust / ${{ matrix.runner }} / gates
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      # check-native-testbeds.sh requires each SUD receipt on x86_64. (strace
      # and the host-oracle requirement belong to the test suite, in `tests`.)
      PATINA_REQUIRE_SUD: ${{ matrix.runner == 'ubuntu-latest' && '1' || '0' }}
      # ...and the go-guest receipt there too (Go guests on aarch64 are not
      # gated yet), so a missing Go fails instead of reporting NOT RUN.
      PATINA_REQUIRE_GO: ${{ matrix.runner == 'ubuntu-latest' && '1' || '0' }}
      # The gate scripts each default to a private target dir so the local
      # check runner can overlap them; here they run one after another, so they
      # share one and build the release cargo-patina and native shim once.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gates-${{ hashFiles('mise.lock', 'rust-toolchain.toml', 'Cargo.toml') }}
          save-if: false
      - run: cargo fmt --all -- --check
      - run: scripts/check-structure.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
      # Flag drift gate: every --flag mentioned in the docs OR in any shell script
      # must exist in the CLI's own machine-readable registry (or the script's
      # small allowlist of non-patina flags).
      - run: scripts/check-flag-drift.sh
      - run: scripts/validate-wasi.sh
      # On x86_64 mise supplies the Go release testbeds/go-guest/go.mod pins.
      - if: matrix.runner == 'ubuntu-latest'
        run: mise exec "go@$(sed -n 's/^toolchain go//p' testbeds/go-guest/go.mod)" -- scripts/check-native-testbeds.sh
      - if: matrix.runner != 'ubuntu-latest'
        run: scripts/check-native-testbeds.sh
      - if: matrix.runner == 'ubuntu-latest'
        run: testbeds/multiproc/run-patina.sh
      - run: scripts/smoke-cross-target.sh
      # Fast, build-free classifier selftests (pure functions over canned tuples;
      # ~1.4s + ~0.5s locally). The fuzz-sweep bash classifier is NOT otherwise
      # covered by a Rust test; the campaign selftest is ALSO exercised by the
      # `campaign_selftest_passes` integration test but kept here as a direct
      # CLI-level gate against the shipped subcommand.
      - run: testbeds/multiproc/run-patina.sh --selftest
      - run: testbeds/workq/fuzz-sweep.sh --selftest
      - run: testbeds/buggify-wasi/wasi-buggify-sweep.sh --selftest
      - run: cargo run -p cargo-patina --quiet -- campaign --selftest
      # The flagship durable-work-queue testbed's full self-checking gate
      # (determinism, record/replay, net/fs faults, crash-recovery, buggify
      # sweep). Its dependency tree is tiny (patina-dst + sha2 only). The
      # heavier randomized fault-combination sweep over this same testbed runs
      # nightly (see the `nightly` job).
      - run: testbeds/workq/run-patina.sh
      # The async-native testbed's full self-checking gate (multi-seed
      # determinism + cross-seed outcome invariance, record/strict-replay,
      # fail-closed planted-bug legs).
      - run: testbeds/pubsub/run-patina.sh
      # The ecosystem symbol-audit corpus: 20 per-crate MREs built + audited,
      # each compared strictly (both directions) to a committed platform
      # expectation file. Linux x86_64 runs it here; the daily/manual
      # macOS job below checks the independently recorded macOS surface.
      - if: matrix.runner == 'ubuntu-latest'
        run: testbeds/audit-corpus/run.sh

  # On a push to main, build what `tests` and `gates` compile and save it
  # under their shared keys, without running them (see `concurrency` above).
  # rust-cache keeps the dependencies and drops the workspace's own crates, so
  # building each profile's dependencies is enough. Each job's environment
  # matches the job that restores its cache, because rust-cache hashes the
  # CARGO_* variables into the key.
  cache-tests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: cache / ${{ matrix.runner }} / tests
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-${{ hashFiles('mise.lock', 'rust-toolchain.toml', 'Cargo.toml') }}
      - run: cargo nextest run --profile ci --workspace --locked --no-run
      - run: cargo test -p patina-dst --features macros --locked --no-run

  cache-gates:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: cache / ${{ matrix.runner }} / gates
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gates-${{ hashFiles('mise.lock', 'rust-toolchain.toml', 'Cargo.toml') }}
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo build --release --locked -p cargo-patina

  # The macOS job is a platform safety net, not a duplicate of every locally
  # validated push. Run the pinned macOS gates daily and on explicit manual
  # dispatch. This repo is public and takes outside pull requests, so CI never
  # runs on a self-hosted machine.
  macos:
    if: (github.event_name == 'workflow_dispatch' && !inputs.bench_only) || github.event.schedule == '17 7 * * *'
    name: macOS / ${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        # The suite and the testbeds share no build (test profile against
        # release), so they run as two parallel jobs.
        part: [suite, testbeds]
    runs-on: macos-latest
    env:
      # The testbed scripts each default to a private target dir; one after
      # another here, they share the workspace's and build the release
      # cargo-patina once.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      # Build against the newest released Xcode the image installs rather than
      # its default selection, so an SDK change surfaces here before it reaches
      # a developer's Mac.
      - name: Select the newest released Xcode
        run: |
          xcode=$(printf '%s\n' /Applications/Xcode_*.app | grep -Eiv 'beta|release_candidate' | sort -V | tail -n 1)
          test -d "$xcode"
          sudo xcode-select --switch "$xcode"
          echo "$xcode: SDK $(xcrun --show-sdk-version)"
      - uses: ./.github/actions/setup-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.part }}-${{ hashFiles('mise.lock', 'rust-toolchain.toml', 'Cargo.toml') }}
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The native shim's per-user build cache (macOS location).
          cache-directories: |
            ~/Library/Caches/patina
      # The workspace suite under nextest, as on Linux (doctests separately).
      # native_abi/native_containment/native_workloads include kqueue and
      # Darwin locks/clocks. native_trace refuses a demanded ktrace guarantee;
      # Linux's required strace detector runs in platform.
      - if: matrix.part == 'suite'
        run: cargo nextest run --profile ci --workspace --locked
      - if: matrix.part == 'suite'
        run: cargo test --workspace --doc --locked
      - if: matrix.part == 'testbeds'
        run: scripts/validate-wasi.sh
      - if: matrix.part == 'testbeds'
        run: scripts/check-native-testbeds.sh
      - if: matrix.part == 'testbeds'
        run: scripts/smoke-cross-target.sh
      - if: matrix.part == 'testbeds'
        run: testbeds/workq/run-patina.sh
      - if: matrix.part == 'testbeds'
        run: testbeds/pubsub/run-patina.sh
      - if: matrix.part == 'testbeds'
        run: testbeds/audit-corpus/run.sh

  # Advisory audit (RustSec). The root workspace lockfile is STRICT — any
  # advisory (including any protobuf appearance) fails the job. The testbeds are
  # separate workspaces with their own locks; every one is strict.
  audit:
    # Lockfiles cannot change between pushes, so scheduled reruns add no signal.
    if: github.event_name != 'schedule' && !inputs.bench_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit root workspace lockfile (strict)
        run: cargo audit --file Cargo.lock
      - name: Audit testbed lockfiles (strict)
        run: |
          # Testbeds are standalone workspaces (publish=false) with their own
          # lockfiles. Every one is strict — no advisory is ignored anywhere.
          for tb in buggify-wasi liveness-campaign pubsub workq native-boundary/rand-rng native-boundary/tokio native-boundary/raw; do
            echo "== audit testbeds/$tb =="
            cargo audit --file "testbeds/$tb/Cargo.lock"
          done

  # Heavy randomized campaign, beyond the per-push budget. The per-push Linux
  # jobs already run the flagship workq testbed's full self-checking battery;
  # nightly adds breadth by sweeping 200 randomized fault-combination
  # generations, including the schedule-fuzz tier. The campaign runs on Linux,
  # where it covers the same deterministic model without duplicating
  # macOS campaign work; the daily macOS job runs the full deterministic gate suite.
  nightly:
    if: (github.event_name == 'workflow_dispatch' && !inputs.bench_only) || github.event.schedule == '17 7 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ hashFiles('mise.lock', 'rust-toolchain.toml', 'Cargo.toml') }}
          # The sweep builds cargo-patina and workq under the root target dir.
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The native shim's per-user build cache.
          cache-directories: |
            ~/.cache/patina
      # A 200-generation randomized fault-combination campaign over the flagship
      # workq testbed, including its schedule-fuzz tier.
      - run: testbeds/workq/fuzz-sweep.sh 1 200

  # The native-versus-Patina overhead benchmark (VALIDATION.md, "Overhead
  # benchmark"): measurement tracked over time, not a gate. Each Linux
  # architecture writes its table to the job summary and uploads its records;
  # it builds and runs repository code, so it holds a read-only token that is
  # not persisted. From main only, bench-publish (write token, no build) then
  # appends one JSON record per workload to data/<os>-<arch>.jsonl on the
  # `bench-data` branch. A dispatch with bench_only runs just these jobs.
  bench:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 7 * * *'
    name: bench / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ hashFiles('mise.lock', 'rust-toolchain.toml', 'Cargo.toml') }}
          workspaces: .
          cache-directories: |
            ~/.cache/patina
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The records file is named for the data file it is appended to.
      - run: |
          platform="$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)"
          mkdir -p "$RUNNER_TEMP/bench"
          python3 scripts/bench.py --runs 10 --output "$RUNNER_TEMP/bench/$platform.jsonl" --summary-md "$RUNNER_TEMP/bench/$platform.md"
      # A failed benchmark still writes its completed records and table.
      - if: always()
        run: cat "$RUNNER_TEMP"/bench/*.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.runner }}
          path: ${{ runner.temp }}/bench/
          if-no-files-found: warn
      - if: github.ref != 'refs/heads/main'
        run: echo "Not main ($GITHUB_REF); computed $(cat "$RUNNER_TEMP"/bench/*.jsonl | wc -l) records; bench-publish is skipped."

  # Runs only when every bench job succeeded, so a failed night publishes
  # nothing (its records stay in the run's artifacts).
  bench-publish:
    needs: bench
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          merge-multiple: true
          path: ${{ runner.temp }}/bench
      - env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          for records in "$RUNNER_TEMP"/bench/*.jsonl; do
            scripts/bench-publish.sh "$records" "data/$(basename "$records")"
          done
