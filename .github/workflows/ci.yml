name: CI

# Every push and pull request runs the landing gate: `mise run check` (format, clippy, then
# `./check quick`) on one GitHub runner. `counters` is informational: it runs the counter
# preemption checks where the runner exposes a PMU and skips them where it does not.
on:
  pull_request:
  push:

# A newer push cancels a branch or PR run, never a main run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  # The runner has four cores.
  CHECK_SLOTS: "4"

jobs:
  check:
    # Pinned: the sandbox setup below is for 24.04 (no AppArmor profile for bwrap, bwrap not
    # installed). ubuntu-22.04's bwrap and kernel are too old.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Host setup for the sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap libsqlite3-dev libssl-dev
          uname -r; bwrap --version; grep -m1 'model name' /proc/cpuinfo; nproc
      - uses: ./.github/actions/setup-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml') }}
          save-if: ${{ github.event_name == 'push' }}
      # The guests are content-addressed by tests/guests.sh: a restored entry is used only when
      # its sources and compilers match, so a stale cache costs a rebuild, never a wrong guest.
      - id: guests
        uses: actions/cache/restore@v6
        with:
          path: target/patina-check/guests
          key: guests-${{ runner.os }}-${{ hashFiles('tests/guests.sh', 'tests/guests/**', 'tests/determinism/attack/**', 'tests/sandbox/guests/**', 'rust-toolchain.toml', 'mise.lock') }}
          restore-keys: guests-${{ runner.os }}-
      - name: Build the guests
        run: |
          [ ! -d target/patina-check/guests ] || find target/patina-check/guests -mindepth 2 -maxdepth 2 -exec touch -h {} +
          # The Rust guests build offline.
          cargo fetch --locked --manifest-path tests/guests/fjall-harness/Cargo.toml
          cargo fetch --locked --manifest-path tests/guests/tokio-mt/Cargo.toml
          mise exec -- sh tests/guests.sh
      - if: always() && steps.guests.outputs.cache-matched-key != steps.guests.outputs.cache-primary-key
        uses: actions/cache/save@v6
        with:
          path: target/patina-check/guests
          key: ${{ steps.guests.outputs.cache-primary-key }}
      - run: mise run check
      # A failing script keeps its run directory; passing ones are deleted.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-runs
          path: target/patina-check/runs
          retention-days: 7

  counters:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Host setup for the sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap libsqlite3-dev libssl-dev
          grep -m1 'model name' /proc/cpuinfo
      - uses: ./.github/actions/setup-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml') }}
          save-if: false
      - uses: actions/cache/restore@v6
        with:
          path: target/patina-check/guests
          key: guests-${{ runner.os }}-${{ hashFiles('tests/guests.sh', 'tests/guests/**', 'tests/determinism/attack/**', 'tests/sandbox/guests/**', 'rust-toolchain.toml', 'mise.lock') }}
          restore-keys: guests-${{ runner.os }}-
      - name: Fetch the Rust guests' dependencies (their builds are offline)
        run: |
          [ ! -d target/patina-check/guests ] || find target/patina-check/guests -mindepth 2 -maxdepth 2 -exec touch -h {} +
          cargo fetch --locked --manifest-path tests/guests/fjall-harness/Cargo.toml
          cargo fetch --locked --manifest-path tests/guests/tokio-mt/Cargo.toml
      # The scripts give a copy of patina CAP_PERFMON with `sudo setcap` and print SKIP when the
      # runner exposes no PMU.
      - run: mise exec -- ./check counters
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: counters-runs
          path: target/patina-check/runs
          retention-days: 7
