name: CI

on:
  pull_request:
  push:
    # ci/** lets a pushed branch run the routine Linux matrix without opening
    # a PR (used for iterating on Linux-only behavior from macOS).
    branches: [main, "ci/**"]
  # The heavy randomized workq campaign runs nightly on Linux, alongside one
  # stable macOS clean-host safety-net run. Ordinary pushes rely on the
  # developer's full local macOS landing gate and spend hosted-runner time on
  # the Linux platforms unavailable locally.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    # Scheduled runs have dedicated jobs below. Pushes, pull requests, and
    # manual dispatches cover both Linux architectures on stable + MSRV.
    if: github.event_name != 'schedule'
    name: ${{ matrix.toolchain }} / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, msrv]
        # x86_64 and aarch64 Linux surface different platform gaps (libgcc
        # split-stack wrap symbols exist only on x86; the dev VM is aarch64).
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.toolchain == 'stable'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - if: matrix.toolchain == 'msrv'
        uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          # The testbed gates below build their own standalone workspaces;
          # without caching them, pubsub's tokio tree compiles cold on every
          # push (workq's tree is tiny, but cache it uniformly).
          workspaces: |
            .
            testbeds/workq
            testbeds/pubsub
      # strace is the Linux whole-run syscall-containment class detector invoked
      # by validate-native-shim.sh. Install it and require it (PATINA_REQUIRE_STRACE=1
      # below) so a runner image without strace hard-fails instead of silently
      # dropping the containment gate.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y strace
      - if: matrix.toolchain == 'stable' && runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - if: matrix.toolchain == 'stable' && runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - if: matrix.toolchain == 'stable' && runner.os == 'Linux'
        run: cargo doc --workspace --no-deps --locked
      # Flag drift gate: every --flag mentioned in the docs OR in any shell script
      # must exist in the CLI's own machine-readable registry (or the script's
      # small allowlist of non-patina flags).
      - if: matrix.toolchain == 'stable' && runner.os == 'Linux'
        run: scripts/check-flag-drift.sh
      - run: scripts/validate-wasi.sh
      - run: scripts/validate-native-shim.sh
        env:
          PATINA_REQUIRE_STRACE: ${{ runner.os == 'Linux' && '1' || '0' }}
      - run: scripts/smoke-cross-target.sh
      # Fast, build-free classifier selftests (pure functions over canned tuples;
      # ~1.4s + ~0.5s locally). The fuzz-sweep bash classifier is NOT otherwise
      # covered by a Rust test; the campaign selftest is ALSO exercised by the
      # `campaign_selftest_passes` integration test but kept here as a direct
      # CLI-level gate against the shipped subcommand.
      - if: matrix.toolchain == 'stable' && runner.os == 'Linux'
        run: testbeds/workq/fuzz-sweep.sh --selftest
      - if: matrix.toolchain == 'stable' && runner.os == 'Linux'
        run: cargo run -p cargo-patina --quiet -- campaign --selftest
      # The flagship durable-work-queue testbed's full self-checking gate
      # (determinism, record/replay, net/fs faults, crash-recovery, buggify
      # sweep). Its dependency tree is tiny (patina-dst + sha2 only) and its own
      # target dir is small, so it fits the per-push budget: measured ~5.5s warm
      # / ~35s cold (dominated by the release cargo-patina + shim compile it
      # shares), well under two minutes. The heavier randomized fault-combination
      # sweep over this same testbed runs nightly (see the `nightly` job).
      - if: matrix.toolchain == 'stable'
        run: testbeds/workq/run-patina.sh
      # The async-native testbed's full self-checking gate (multi-seed
      # determinism + cross-seed outcome invariance, record/strict-replay,
      # fail-closed planted-bug legs). Its dependency tree adds tokio, cached
      # via the rust-cache workspaces above.
      - if: matrix.toolchain == 'stable'
        run: testbeds/pubsub/run-patina.sh
      # The ecosystem symbol-audit corpus: 20 per-crate MREs built + audited,
      # each compared strictly (both directions) to a committed platform
      # expectation file. Stable Linux x86_64 runs it here; the daily/manual
      # macOS job below checks the independently recorded macOS surface.
      - if: matrix.toolchain == 'stable' && matrix.runner == 'ubuntu-latest'
        run: testbeds/audit-corpus/run.sh

  # Hosted macOS is a clean-environment safety net, not a duplicate of every
  # locally validated push. Run the stable macOS gates daily and on explicit
  # manual dispatch; MSRV remains covered on both Linux architectures.
  macos:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 7 * * *'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            testbeds/workq
            testbeds/pubsub
      - run: cargo test --workspace --locked
      - run: scripts/validate-wasi.sh
      # macOS has no sound whole-run syscall tracing gate; the native script
      # still exercises the static instruction scan, import audit, and runtime
      # behavior. Linux's required strace detector runs in `platform` above.
      - run: scripts/validate-native-shim.sh
        env:
          PATINA_REQUIRE_STRACE: "0"
      - run: scripts/smoke-cross-target.sh
      - run: testbeds/workq/run-patina.sh
      - run: testbeds/pubsub/run-patina.sh
      - run: testbeds/audit-corpus/run.sh

  # Advisory audit (RustSec). The root workspace lockfile is STRICT — any
  # advisory (including any protobuf appearance) fails the job. The testbeds are
  # separate workspaces with their own locks; every one is strict.
  audit:
    # Lockfiles cannot change between pushes, so scheduled reruns add no signal.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit root workspace lockfile (strict)
        run: cargo audit --file Cargo.lock
      - name: Audit testbed lockfiles (strict)
        run: |
          # Testbeds are standalone workspaces (publish=false) with their own
          # lockfiles. Every one is strict — no advisory is ignored anywhere.
          for tb in buggify-wasi liveness-campaign pubsub workq; do
            echo "== audit testbeds/$tb =="
            cargo audit --file "testbeds/$tb/Cargo.lock"
          done

  # Heavy randomized campaign, beyond the per-push budget. The per-push Linux
  # jobs already run the flagship workq testbed's full self-checking battery;
  # nightly adds breadth by sweeping 200 randomized fault-combination
  # generations, including the schedule-fuzz tier. The campaign runs on Linux,
  # where it covers the same deterministic model without duplicating hosted
  # macOS minutes; the daily macOS job runs the full deterministic gate suite.
  nightly:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 7 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache the root workspace (cargo-patina + shim) and the workq testbed
          # so the campaign's per-generation builds reuse warm artifacts.
          workspaces: |
            .
            testbeds/workq
      # A 200-generation randomized fault-combination campaign over the flagship
      # workq testbed, including its schedule-fuzz tier.
      - run: testbeds/workq/fuzz-sweep.sh 1 200
