name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly heavy randomized campaign over the flagship workq testbed (see the
  # `nightly` job). Also manually triggerable. 07:17 UTC dodges top-of-hour cron
  # congestion on GitHub-hosted runners.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and aarch64 Linux surface different platform gaps (libgcc
        # split-stack wrap symbols exist only on x86; the dev VM is aarch64).
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      # strace is the Linux whole-run syscall-containment class detector invoked
      # by validate-native-shim.sh. Install it and require it (PATINA_REQUIRE_STRACE=1
      # below) so a runner image without strace hard-fails instead of silently
      # dropping the containment gate.
      - run: sudo apt-get update && sudo apt-get install -y strace
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
      # The `patina-dst` facade (`run`/`run_with`, `Context`, `rt`, ABI re-exports)
      # lives behind the non-default `runtime` feature; the default-feature build
      # is the dependency-light cooperative-SUT SDK. Cover the facade explicitly.
      - run: cargo clippy -p patina-dst --all-targets --features runtime --locked -- -D warnings
      - run: cargo test -p patina-dst --features runtime --locked
      - run: cargo doc -p patina-dst --no-deps --features runtime --locked
      - run: scripts/validate-wasi.sh
      - run: scripts/validate-native-shim.sh
        env:
          PATINA_REQUIRE_STRACE: 1
      - run: scripts/smoke-cross-target.sh
      # Fast, build-free classifier selftests (pure functions over canned tuples;
      # ~1.4s + ~0.5s locally). The fuzz-sweep bash classifier is NOT otherwise
      # covered by a Rust test; the campaign selftest is ALSO exercised by the
      # `campaign_selftest_passes` integration test but kept here as a direct
      # CLI-level gate against the shipped subcommand.
      - run: testbeds/workq/fuzz-sweep.sh --selftest
      - run: cargo run -p cargo-patina --quiet -- campaign --selftest
      # The flagship durable-work-queue testbed's full self-checking gate
      # (determinism, record/replay, net/fs faults, crash-recovery, buggify
      # sweep). Its dependency tree is tiny (patina-dst + sha2 only) and its own
      # target dir is small, so it fits the per-push budget: measured ~5.5s warm
      # / ~35s cold (dominated by the release cargo-patina + shim compile it
      # shares), well under two minutes. The heavier randomized fault-combination
      # sweep over this same testbed runs nightly (see the `nightly` job).
      - run: testbeds/workq/run-patina.sh

  msrv:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y strace
      - run: cargo test --workspace --locked
      - run: scripts/validate-wasi.sh
      - run: scripts/validate-native-shim.sh
        env:
          PATINA_REQUIRE_STRACE: 1
      - run: scripts/smoke-cross-target.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: scripts/validate-wasi.sh
      # macOS runtime syscall containment is not verifiable via ktrace (BSC_*
      # events carry no path context and the runtime defers all output, so the
      # loader prelude cannot be separated from post-init guest syscalls), so
      # PATINA_REQUIRE_KTRACE is deliberately NOT set here — it would hard-fail.
      # The static instruction scan + import audit are the macOS containment
      # evidence, and PATINA_REQUIRE_STRACE is a Linux-only concern (the macOS
      # branch never reaches the strace check); the strace default-deny gate runs
      # on the Linux jobs.
      - run: scripts/validate-native-shim.sh
      - run: scripts/smoke-cross-target.sh
      # The workq testbed's full Patina gate also runs per-push on macOS (see the
      # justification on the stable job); it is bash-3.2-safe for the macOS runner.
      - run: testbeds/workq/run-patina.sh

  # Advisory audit (RustSec). The root workspace lockfile is STRICT — any
  # advisory (including any protobuf appearance) fails the job. The testbeds are
  # separate workspaces with their own locks; every one is strict.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit root workspace lockfile (strict)
        run: cargo audit --file Cargo.lock
      - name: Audit testbed lockfiles (strict)
        run: |
          # Testbeds are standalone workspaces (publish=false) with their own
          # lockfiles. Every one is strict — no advisory is ignored anywhere.
          for tb in buggify-wasi liveness-campaign workq; do
            echo "== audit testbeds/$tb =="
            cargo audit --file "testbeds/$tb/Cargo.lock"
          done

  # Heavy randomized campaign, beyond the per-push budget. The per-push jobs
  # already run the flagship workq testbed's full self-checking battery
  # (testbeds/workq/run-patina.sh); nightly adds breadth by sweeping 200
  # randomized fault-combination generations over that same testbed — including
  # its schedule-fuzz tier — which is far too long to run on every push. Runs
  # nightly (cron) and on manual dispatch, on Linux and macOS.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache the root workspace (cargo-patina + shim) and the workq testbed
          # so the campaign's per-generation builds reuse warm artifacts.
          workspaces: |
            .
            testbeds/workq
      # A 200-generation randomized fault-combination campaign over the flagship
      # workq testbed, including its schedule-fuzz tier.
      - run: testbeds/workq/fuzz-sweep.sh 1 200
