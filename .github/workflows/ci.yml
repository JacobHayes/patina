name: CI
on: push
defaults:
  run:
    shell: bash
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CHECK_SLOTS: "4"
  PATINA_CHECK_DIR: ${{ github.workspace }}-check
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/check-host
      - name: Build the guests
        run: mise exec -- bash tests/guests.sh
      - name: Build both
        run: |
          git worktree add $RUNNER_TEMP/main origin/main
          (cd $RUNNER_TEMP/main && CARGO_TARGET_DIR=$RUNNER_TEMP/main-target mise exec -- cargo build --release --quiet -p patina-cli)
          mise exec -- cargo build --release --quiet -p patina-cli
      - name: Bench
        run: |
          set=$(mise exec -- bash tests/guests.sh)
          cd .bench && ./bench.sh $GITHUB_WORKSPACE/target/release/patina $RUNNER_TEMP/main-target/release/patina $set/guests
      - name: Quick tier
        run: mise exec -- ./check quick
