name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and aarch64 Linux surface different platform gaps (libgcc
        # split-stack wrap symbols exist only on x86; the dev VM is aarch64).
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
      # The `patina` facade (`run`/`run_with`, `Context`, `rt`, ABI re-exports)
      # lives behind the non-default `runtime` feature; the default-feature build
      # is the dependency-light cooperative-SUT SDK. Cover the facade explicitly.
      - run: cargo clippy -p patina --all-targets --features runtime --locked -- -D warnings
      - run: cargo test -p patina --features runtime --locked
      - run: cargo doc -p patina --no-deps --features runtime --locked
      - run: scripts/validate-wasi.sh
      - run: scripts/validate-native-shim.sh
      - run: scripts/smoke-cross-target.sh

  msrv:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: scripts/validate-wasi.sh
      - run: scripts/validate-native-shim.sh
      - run: scripts/smoke-cross-target.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      # macOS runtime syscall containment is not verifiable via ktrace (BSC_*
      # events carry no path context and the runtime defers all output, so the
      # loader prelude cannot be separated from post-init guest syscalls), so
      # PATINA_REQUIRE_KTRACE is deliberately NOT set here — it would hard-fail.
      # The static instruction scan + import audit are the macOS containment
      # evidence; the strace default-deny gate runs on the Linux jobs.
      - run: scripts/validate-native-shim.sh
      - run: scripts/smoke-cross-target.sh
