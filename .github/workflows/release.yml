name: Release

# A `v*` tag builds the one release artifact, a static x86_64 Linux `patina` with the runtime
# embedded; checks it names the tag's version; installs it from the archive with install.sh,
# on the runner and in a bare ubuntu:24.04 container; runs the adopter smoke; and only then
# pushes the Go SDK's tag and publishes the release. A manual run does all of that except
# publish, and ends by installing the latest published release with the documented one-liner.
# Linux x86_64 only. Nothing here publishes to crates.io.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Host setup for the sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
      - uses: ./.github/actions/setup-toolchain
      - run: rustup target add "$TARGET"
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: cargo build --release --locked -p patina-cli --target "$TARGET"
      - name: A release tag names the version it builds
        if: github.ref_type == 'tag'
        run: test "$(target/$TARGET/release/patina --version)" = "patina ${GITHUB_REF_NAME#v}"
      - name: Package
        run: |
          mkdir dist
          tar -czf "dist/patina-$TARGET.tar.gz" -C "target/$TARGET/release" patina -C "$PWD" LICENSE-APACHE
          cp install.sh dist/
          (cd dist && sha256sum "patina-$TARGET.tar.gz" >SHA256SUMS && cat SHA256SUMS)
      # No Rust, no C compiler: only bubblewrap and curl, and the three options a container needs.
      - name: Install in a bare ubuntu:24.04 container
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined \
            ubuntu:24.04 sh -euc '
              apt-get update -qq && apt-get install -y -qq bubblewrap curl >/dev/null
              PATINA_RELEASE_URL=file:///dist sh /dist/install.sh --prefix /usr/local
              patina run -- /bin/sh -c "echo hello from the sandbox"'
      - name: Install from the archive and run the adopter smoke
        env:
          PATINA_RELEASE_URL: file://${{ github.workspace }}/dist
        run: |
          # The smoke's projects live outside this checkout, where its toolchain file does not reach.
          export RUSTUP_TOOLCHAIN="$(awk -F'"' '/^channel/ {print $2}' rust-toolchain.toml)"
          sh install.sh --prefix "$RUNNER_TEMP/patina"
          export PATH="$RUNNER_TEMP/patina/bin:$PATH"
          scripts/install-smoke.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # Publish the release, and the tag the Go module is fetched by: a module in a subdirectory
  # is versioned by a tag that carries its path.
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "HEAD:refs/tags/go/patina/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            dist/patina-*.tar.gz dist/SHA256SUMS dist/install.sh

  # Install the published release as the README says, on a fresh runner, and run the smoke.
  published:
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.publish.result == 'success') }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Only for the smoke script and the examples it builds.
      - uses: actions/checkout@v7
        with:
          path: patina-checkout
      - run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: curl -fsSL https://github.com/JacobHayes/patina/releases/latest/download/install.sh | sh
      - run: patina-checkout/scripts/install-smoke.sh
