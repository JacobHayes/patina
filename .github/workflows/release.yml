name: Release

# A `v*` tag runs the release tier (`./check release`, tests/run.py) on both architectures and
# builds the release artifacts, one static Linux `patina` per architecture with the
# runtime embedded, each natively on a runner of its architecture, as an archive and a Debian
# package; checks each names the tag's version; installs the package with user namespaces
# restricted, and the archive with install.sh, on its runner and in a bare ubuntu:24.04
# container; runs the adopter smoke on both; merges the files under one SHA256SUMS; and only then pushes the Go SDK's tag and publishes the release. A manual run does
# all of that except publish, and ends by installing the latest published release with the
# documented one-liner on both architectures (`published: false` skips that, for a dry run
# before the first release that has both). Nothing here publishes to crates.io.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      published:
        description: End by installing the latest published release
        type: boolean
        default: true

# bash -eo pipefail: a step fails when any command of a pipeline fails, not only its last.
defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  # Outside target/, as in ci.yml.
  PATINA_CHECK_DIR: ${{ github.workspace }}-check

jobs:
  # The release tier, on a runner of each architecture: the gate before publish.
  check:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CHECK_SLOTS: "4"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/check-host
      - run: mise exec -- ./check release
      - if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release-check-runs-${{ matrix.runner }}
          path: ${{ env.PATINA_CHECK_DIR }}/runs
          retention-days: 7

  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - run: rustup target add "$TARGET"
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: cargo build --release --locked -p patina-cli --target "$TARGET"
      - name: A release tag names the version it builds
        if: github.ref_type == 'tag'
        run: test "$(target/$TARGET/release/patina --version)" = "patina ${GITHUB_REF_NAME#v}"
      # This architecture's archive with a SHA256SUMS of its own, for the installs below, and
      # its Debian package (scripts/deb).
      - name: Package
        run: |
          mkdir dist
          tar -czf "dist/patina-$TARGET.tar.gz" -C "target/$TARGET/release" patina -C "$PWD" LICENSE-APACHE
          cp install.sh dist/
          (cd dist && sha256sum "patina-$TARGET.tar.gz" >SHA256SUMS && cat SHA256SUMS)
          v=$(target/$TARGET/release/patina --version)
          scripts/deb "target/$TARGET/release/patina" "${v#patina }" dist
          ls -l dist
      # The runner restricts unprivileged user namespaces as Ubuntu 24.10 and later do: the
      # package's AppArmor profile alone admits the sandbox.
      - name: Install the Debian package, user namespaces restricted
        run: |
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          sudo apt-get install -y -qq ./dist/patina_*.deb
          /usr/bin/patina doctor
          /usr/bin/patina run --out "$RUNNER_TEMP/deb-run" -- /bin/sh -c "echo hello from the sandbox"
          sudo apt-get remove -y -qq patina
          if /usr/bin/patina --version 2>/dev/null; then exit 1; fi
      # The installs below run without the profile.
      - name: Host setup for the sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # No Rust, no C compiler: only curl, and the three options a container needs.
      - name: Install in a bare ubuntu:24.04 container
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined \
            ubuntu:24.04 sh -euc '
              apt-get update -qq && apt-get install -y -qq curl >/dev/null
              PATINA_RELEASE_URL=file:///dist sh /dist/install.sh --prefix /usr/local
              patina run -- /bin/sh -c "echo hello from the sandbox"'
      - name: Install from the archive and run the adopter smoke
        env:
          PATINA_RELEASE_URL: file://${{ github.workspace }}/dist
        run: |
          # The smoke's projects live outside this checkout, where its toolchain file does not reach.
          export RUSTUP_TOOLCHAIN="$(awk -F'"' '/^channel/ {print $2}' rust-toolchain.toml)"
          sh install.sh --prefix "$RUNNER_TEMP/patina"
          export PATH="$RUNNER_TEMP/patina/bin:$PATH"
          scripts/install-smoke.sh
      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/patina-${{ matrix.target }}.tar.gz
            dist/patina_*.deb
          if-no-files-found: error

  # The release's files: both archives and packages, the agent skill (skills/patina, with the version
  # it was released with in VERSION), one SHA256SUMS listing them, install.sh (a tag's installs that
  # tag's version unless given --version).
  dist:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            scripts/stamp-install "$GITHUB_REF_NAME" >dist/install.sh
            version=${GITHUB_REF_NAME#v}
          else
            cp install.sh dist/
            version=$(git rev-parse --short HEAD)
          fi
          mkdir "$RUNNER_TEMP/skill"
          cp -r skills/patina "$RUNNER_TEMP/skill/"
          echo "$version" >"$RUNNER_TEMP/skill/patina/VERSION"
          tar -czf dist/patina-skill.tar.gz -C "$RUNNER_TEMP/skill" patina
          test "$(tar -xzOf dist/patina-skill.tar.gz patina/VERSION)" = "$version"
          (cd dist && sha256sum patina-*.tar.gz patina_*.deb >SHA256SUMS && cat SHA256SUMS)
          test "$(wc -l <dist/SHA256SUMS)" = 5
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # Publish the release, and the tag the Go module is fetched by: a module in a subdirectory
  # is versioned by a tag that carries its path.
  publish:
    if: github.ref_type == 'tag'
    needs: [check, dist]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "HEAD:refs/tags/go/patina/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            dist/patina-*.tar.gz dist/patina_*.deb dist/SHA256SUMS dist/install.sh

  # Install the published release as the README says, on a fresh runner of each architecture,
  # and run the smoke.
  published:
    if: ${{ !cancelled() && (github.event_name == 'push' && needs.publish.result == 'success' || github.event_name == 'workflow_dispatch' && inputs.published) }}
    needs: publish
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      # Only for the smoke script and the examples it builds.
      - uses: actions/checkout@v7
        with:
          path: patina-checkout
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: curl -fsSL https://github.com/JacobHayes/patina/releases/latest/download/install.sh | sh
      - run: patina-checkout/scripts/install-smoke.sh
