# Standalone package: its own empty [workspace] table keeps this probe OUT
# of the root Patina workspace (the testbeds convention), so `cargo` here never
# touches crates/ or the root manifest and it carries its own committed
# Cargo.lock.
#
# NOT part of the CORPUS: this is the selftest's reliably-dirty probe. It
# imports a dynamic loader the shim never defines (`dlmopen` on Linux,
# `dlopen_preflight` on macOS), which the static-audit architecture refuses BY
# DESIGN forever (loading host code defeats symbol-reachability auditing), so
# unlike real corpus crates it can never drift to CLEAN.
[workspace]

[package]
name = "mre_selftest_dynamic_loading"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "mre_selftest_dynamic_loading"
path = "src/main.rs"

[profile.dev]
debug = false
