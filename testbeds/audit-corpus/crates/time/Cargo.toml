# Standalone package: its own empty [workspace] table keeps this MRE OUT
# of the root Patina workspace (the testbeds convention), so `cargo` here never
# touches crates/ or the root manifest and it carries its own committed
# Cargo.lock.
[workspace]

[package]
name = "mre_time"
version = "0.0.0"
edition = "2021"

[dependencies]
time = { version = "0.3", features = ["local-offset"] }

[[bin]]
name = "mre_time"
path = "src/main.rs"

[profile.dev]
debug = false
