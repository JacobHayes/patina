# The probe manifest: which kernel rows and which libc symbols each probe
# covers. The registry (crates/patina-syscalls/src/) names a probe
# id per row; the cross-gate (src/registry_gate.rs)
# checks both directions against this file, and `conform check-manifest`
# refuses a name that is not a registry row before any leg runs.
#
# The virtual ABI level and each row's first kernel (`since`) live in the
# registry (`registry::VIRTUAL_ABI`, `SyscallRow::since`) and reach the harness
# through the pure shared metadata crate, never a constant here.
#
# Per probe: `syscalls` are the rows it exercises (the native leg is
# host-unavailable when the host kernel predates one), `absent` the rows it
# asserts ENOSYS for because their `since` is past the virtual ABI level (the
# native leg is host-unavailable when the host kernel IMPLEMENTS one), and
# `symbols` the libc spellings the `libc` vehicle goes through.

[probe."fs/open_rw"]
syscalls = ["openat", "read", "write", "lseek", "close"]
symbols = ["openat", "read", "write", "lseek", "close"]

[probe."fs/metadata"]
syscalls = ["fstat", "newfstatat", "statx", "getpid", "getuid", "getgid", "openat", "write", "close", "mkdirat", "symlinkat", "linkat"]
symbols = ["fstat", "fstatat", "statx", "getpid", "getuid", "getgid", "openat", "write", "close", "mkdirat", "symlinkat", "linkat"]

[probe."fs/dirs"]
syscalls = ["mkdirat", "renameat", "unlinkat", "newfstatat", "openat", "write", "fstat", "close"]
