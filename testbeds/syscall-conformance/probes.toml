# The probe manifest: which kernel rows and which libc symbols each probe
# covers. The registry (crates/patina-native-shim/src/registry/) names a probe
# id per Modeled row; the cross-gate checks both directions against this file.
#
# [abi].virtual is the kernel ABI level patina's virtual kernel claims and is
# stamped into every expectation header. [since] is the first mainline kernel
# carrying each number; the native leg marks a probe host-unavailable (not
# failed) when the host kernel predates one of its rows.

[abi]
virtual = "6.8"

[since]
read = "2.6.0"
write = "2.6.0"
close = "2.6.0"
lseek = "2.6.0"
fstat = "2.6.0"
dup = "2.6.0"
fcntl = "2.6.0"
flock = "2.6.0"
clock_gettime = "2.6.0"
gettimeofday = "2.6.0"
nanosleep = "2.6.0"
clock_nanosleep = "2.6.0"
socket = "2.6.0"
bind = "2.6.0"
listen = "2.6.0"
connect = "2.6.0"
sendto = "2.6.0"
recvfrom = "2.6.0"
getsockname = "2.6.0"
getpeername = "2.6.0"
shutdown = "2.6.0"
setsockopt = "2.6.0"
getsockopt = "2.6.0"
epoll_ctl = "2.6.0"
epoll_wait = "2.6.0"
futex = "2.6.0"
getpid = "2.6.0"
getuid = "2.6.0"
getgid = "2.6.0"
getdents64 = "2.6.0"
openat = "2.6.16"
newfstatat = "2.6.16"
mkdirat = "2.6.16"
unlinkat = "2.6.16"
renameat = "2.6.16"
symlinkat = "2.6.16"
readlinkat = "2.6.16"
linkat = "2.6.16"
ppoll = "2.6.16"
pipe2 = "2.6.27"
eventfd2 = "2.6.27"
epoll_create1 = "2.6.27"
accept4 = "2.6.28"
getrandom = "3.17"
statx = "4.11"

[probe."fs/open_rw"]
syscalls = ["openat", "read", "write", "lseek", "close"]
symbols = ["openat", "read", "write", "lseek", "close"]

[probe."fs/metadata"]
syscalls = ["fstat", "newfstatat", "statx", "getpid", "getuid", "getgid", "openat", "write", "close", "mkdirat", "symlinkat", "linkat"]
symbols = ["fstat", "fstatat", "statx", "getpid", "getuid", "getgid", "openat", "write", "close", "mkdirat", "symlinkat", "linkat"]

[probe."fs/dirs"]
syscalls = ["mkdirat", "renameat", "unlinkat", "newfstatat", "openat", "write", "fstat", "close"]
symbols = ["mkdirat", "renameat", "unlinkat", "fstatat", "openat", "write", "fstat", "close"]

[probe."fs/getdents"]
syscalls = ["getdents64", "openat", "close", "lseek", "mkdirat", "symlinkat", "unlinkat"]
symbols = ["getdents64", "openat", "close", "lseek", "mkdirat", "symlinkat", "unlinkat"]

[probe."fs/links"]
syscalls = ["symlinkat", "readlinkat", "linkat", "newfstatat", "openat", "write", "close", "mkdirat", "unlinkat"]
symbols = ["symlinkat", "readlinkat", "linkat", "fstatat", "openat", "write", "close", "mkdirat", "unlinkat"]

[probe."fd/pipes"]
syscalls = ["pipe2", "dup", "fcntl", "flock", "read", "write", "close", "openat"]
symbols = ["pipe2", "dup", "fcntl", "flock", "read", "write", "close", "openat"]

[probe."time/clocks"]
syscalls = ["clock_gettime", "gettimeofday", "nanosleep", "clock_nanosleep"]
symbols = ["clock_gettime", "gettimeofday", "nanosleep", "clock_nanosleep"]

[probe."entropy/getrandom"]
syscalls = ["getrandom"]
symbols = ["getrandom"]

[probe."net/udp"]
syscalls = ["socket", "bind", "sendto", "recvfrom", "getsockname", "getpeername", "connect", "shutdown", "setsockopt", "getsockopt", "listen", "accept4", "openat", "close"]
symbols = ["socket", "bind", "sendto", "recvfrom", "getsockname", "getpeername", "connect", "shutdown", "setsockopt", "getsockopt", "listen", "accept4", "openat", "close"]

[probe."net/tcp"]
syscalls = ["socket", "bind", "listen", "connect", "accept4", "sendto", "recvfrom", "shutdown", "getsockname", "getpeername", "setsockopt", "getsockopt", "close"]
symbols = ["socket", "bind", "listen", "connect", "accept4", "sendto", "recvfrom", "shutdown", "getsockname", "getpeername", "setsockopt", "getsockopt", "close"]

[probe."readiness/epoll"]
syscalls = ["epoll_create1", "epoll_ctl", "epoll_wait", "eventfd2", "pipe2", "read", "write", "close", "openat", "clock_gettime"]
symbols = ["epoll_create1", "epoll_ctl", "epoll_wait", "eventfd", "pipe2", "read", "write", "close", "openat", "clock_gettime"]

[probe."readiness/ppoll"]
syscalls = ["ppoll", "pipe2", "eventfd2", "read", "write", "close", "clock_gettime"]
symbols = ["ppoll", "pipe2", "eventfd", "read", "write", "close", "clock_gettime"]

[probe."thread/futex"]
syscalls = ["futex", "clock_gettime"]
symbols = ["syscall", "clock_gettime"]
