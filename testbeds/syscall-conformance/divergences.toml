# ---- signals + threads + process: the frozen oracle ------------------------
# Every entry below is `pending: signals — M<k>: …` (a gap the runtime closes;
# the leg lists every difference it still finds; M<k> is the step of the
# spec's suggested order, docs/arcs/syscall-conformance-signals.md §4, that
# closes it) or a `by design:` abort (a fork-based child oracle the host
# needs). The frozen manifest (frozen.toml) holds this exact set: a builder may
# only DELETE pending entries here, and `gate.sh --family signals` passes when
# none is left.

