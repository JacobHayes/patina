# Every declared host≠patina divergence, with its reason and the responsible
# code. `run.sh --mode patina` fails on an undeclared divergence AND on a
# declared one that no longer diverges (stale), so this file is always exactly
# the current gap. Reasons are `pending: <family>` naming the arc family
# (docs/arcs/syscall-conformance.md §6) that closes them.
#
# [[divergence]]
# probe   = "fs/open_rw"        # probe id (required)
# vehicle = "syscall"           # optional: only this vehicle (absent = every vehicle)
# kind    = "field"             # "field" (default), "abort" (dies at `seq`; the
#                               # prefix is compared), or "probe" (the whole probe
#                               # fails under patina)
# op      = "openat"            # field kind: the event op, or "*"
# field   = "errno"             # field kind: op | ret | errno | args.<k> | fields.<k>
# seq     = 12                  # optional: one event index
# seqs    = [12, 14]            # optional: a set of event indices
# label   = "…"                 # optional: only `check` events with this label
# reason  = "pending: fs — …"   # required
#
# Event indices refer to the blessed expected/<probe>.linux-x86_64.jsonl.

[[divergence]]
probe = "fs/getdents"
kind = "probe"
reason = "pending: fs — the libc symbol getdents64 is not interposed (no definition in patina_posix.c; C readdir is the only door), so the pre-run audit refuses the probe binary as unknown-import for every vehicle"

[[divergence]]
probe = "readiness/ppoll"
kind = "probe"
reason = "pending: network+readiness — the libc symbol ppoll is not interposed (no definition in patina_posix.c; only the SUD ppoll row exists), so the pre-run audit refuses the probe binary as wait-multiplex for every vehicle"

# ---- fatal traps -----------------------------------------------------------
# These probes die inside the runtime at a known event. Both fatal paths
# (`trap_fatal` and the thread module's `fatal`) flush the captured stdout
# before aborting, so the recorded prefix is compared exactly up to `seq`.

