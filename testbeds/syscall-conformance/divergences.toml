kind = "abort"
seq = 19
reason = "pending: network — recvfrom(MSG_DONTWAIT) on a blocking datagram socket ignores the flag and parks the only task (sud/net.rs sys_recvfrom → patina-sched-det lib.rs:574 deadlock fatal)"

[[divergence]]
probe = "net/udp"
vehicle = "syscall"
kind = "abort"
seq = 19
reason = "(syscall(2) forwards into the same SUD row) pending: network — recvfrom(MSG_DONTWAIT) on a blocking datagram socket ignores the flag and parks the only task (sud/net.rs sys_recvfrom → patina-sched-det lib.rs:574 deadlock fatal)"

