# ---- readiness/epoll -----------------------------------------------------------

[[divergence]]
probe = "readiness/epoll"
op = "epoll_wait"
field = "fields.events"
seq = 91
reason = "pending: network+readiness — with maxevents below the ready count the reactor delivers events in descriptor order (lib.rs epoll `scan` walks the interest BTreeMap), where the kernel delivers them in ready-list order: FIFO by readiness arrival, a level-triggered item re-queued at the tail after each delivery (fs/eventpoll.c ep_send_events), so the writer registered first comes before the reader that became ready later"

[[divergence]]
probe = "readiness/epoll"
op = "epoll_wait"
field = "fields.events"
seqs = [95, 98]
reason = "pending: network+readiness — a pipe read end whose last writer closed reports EPOLLIN alone (lib.rs epoll `scan`: EPOLLHUP needs read_eof AND write_eof, and `pipe_readiness` keeps `readable` true at EOF), where the kernel reports EPOLLIN|EPOLLHUP while data remains and EPOLLHUP alone once drained (fs/pipe.c pipe_poll: EPOLLHUP when `!pipe->writers`, EPOLLIN only when the buffer is non-empty)"

[[divergence]]
probe = "readiness/epoll"
op = "check"
field = "ret"
label = "closing the writer removes its interest and hangs up the reader"
reason = "pending: network+readiness — see epoll_wait seqs 95/98"

[[divergence]]
probe = "readiness/epoll"
op = "check"
field = "ret"
label = "a drained hung-up pipe still reports EPOLLHUP"
reason = "pending: network+readiness — see epoll_wait seqs 95/98"

