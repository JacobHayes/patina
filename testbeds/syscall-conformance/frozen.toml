# ---- spec §4, M4 ----

[[family.signals.obligation]]
kind = "unit-test"
crate = "cargo-patina"
test = "guest_exit_reports_the_core_flag"
asserts = "The patina.result/v1 envelope's guest_exit carries core: true|false taken from the child's wait status (ExitStatusExt::core_dumped) whenever signal is present, and no core key for a normal exit."

[[family.signals.obligation]]
kind = "unit-test"
crate = "cargo-patina"
test = "default_terminate_finalizes_then_dies_by_the_signal"
asserts = "End to end: a guest that sends itself a SIG_DFL SIGTERM under `run --record` leaves a COMPLETE trace, the child's wait status is signaled 15 (not an exit code), and replay reproduces the same death."

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-native-shim"
test = "broken_pipe_generates_sigpipe_before_epipe"
asserts = "A write to a reader-less pipe records a thread-directed SignalGenerated for SIGPIPE with the runtime lock released, then answers EPIPE; with SIG_IGN the generation is recorded and dropped."

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-native-shim"
test = "msg_nosignal_suppresses_sigpipe"
asserts = "A socketpair send to a closed peer with MSG_NOSIGNAL answers EPIPE and records no generation; without the flag it records one."

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-native-shim"
test = "sigstop_to_self_is_a_named_trap"
asserts = "A default-action Stop-class signal reaching delivery is the named fatal trap; SIGTSTP/SIGTTIN/SIGTTOU with a handler run the handler."

