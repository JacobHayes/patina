# ---- spec §4, M3 ----

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-native-shim"
test = "process_directed_signal_picks_the_leader_when_unblocked_else_lowest_unblocked"
asserts = "For a process-directed generation the chosen task is the main task when it does not block the signal, else the lowest TaskId that does not, else nobody (it stays shared-pending) — independent of which task generated it."

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-native-shim"
test = "generation_wakes_only_the_chosen_parked_task"
asserts = "With two tasks parked in registered waits, a generation records at most one TaskWake — for the chosen task — and leaves the other parked and on its waiter list."

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-native-shim"
test = "interrupted_waiter_is_unlinked_before_wake"
asserts = "The chosen task is removed from its primitive's waiter list (pipe, futex, readiness, sleep timer) before it is woken, so a later data wake neither finds nor double-wakes it."

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-native-shim"
test = "sa_restart_restarts_pipe_read"
asserts = "A pipe read resumed as Step::Interrupted by a handler installed with SA_RESTART re-enters the wait and returns the byte written later."

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-native-shim"
test = "no_sa_restart_pipe_read_is_eintr"
asserts = "The same read without SA_RESTART returns EINTR after the handler's delivery point."

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-native-shim"
test = "nanosleep_interrupted_reports_remaining_and_never_restarts"
asserts = "An interrupted sleep returns EINTR even under SA_RESTART with remaining = deadline - virtual now, 0 < remaining <= request, on both doors' out-pointers."

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-native-shim"
test = "absolute_clock_nanosleep_leaves_rem_untouched"
asserts = "An interrupted TIMER_ABSTIME clock_nanosleep returns EINTR and does not write rem."

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-native-shim"
test = "epoll_wait_is_eintr_even_with_sa_restart"
asserts = "A readiness wait resumed as interrupted returns EINTR regardless of SA_RESTART and leaves no readiness waiter registered."

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-native-shim"
test = "timed_futex_wait_is_eintr_under_a_handler"
asserts = "A FUTEX_WAIT with a timeout interrupted by a handler is EINTR regardless of SA_RESTART; without a timeout it restarts under SA_RESTART and is EINTR otherwise."

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-native-shim"
test = "sigsuspend_parks_until_an_unblocked_signal"
asserts = "rt_sigsuspend installs its mask and parks; a signal the temporary mask blocks only becomes pending; one it does not wakes the task, which returns EINTR with the previous mask restored; pause and a NULL-timeout rt_sigtimedwait park the same way."

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-native-shim"
test = "signalfd_readable_iff_matching_pending"
asserts = "A signalfd's readiness is true exactly while a signal in its mask is pending for the reader; a read dequeues without running a handler; a blocking read parks until generation."

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-runtime"
test = "signal_wake_records_task_wake_before_scheduler_next"
asserts = "Record then replay of task_park, task_wake, scheduler_next consumes the three ops in that order."

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-runtime"
test = "early_signal_wake_deregisters_timed_sleep"
asserts = "Waking a task parked with a deadline before it fires deregisters the timer: the deadlock rescue does not wake it again."

