# ---- spec §4, M5 ----

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-native-shim"
test = "thread_directed_signal_targets_only_that_task"
asserts = "tgkill/tkill queue to the named task's private set, choose that task alone for the wake, and deliver at ITS next delivery point; the generating task neither runs the handler nor is marked interrupted."

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-native-shim"
test = "pending_for_a_blocking_task_is_invisible_to_another_tasks_sigpending"
asserts = "A thread-directed signal pending for a task that blocks it is absent from every other task's rt_sigpending and is delivered when that task unblocks."

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-native-shim"
test = "set_tid_address_is_cleared_and_woken_at_thread_finish"
asserts = "set_tid_address returns the managed tid and records the word per task; thread_finish writes 0 to it and futex-wakes its waiters."

[[family.signals.obligation]]
kind = "unit-test"
crate = "patina-dst-native-shim"
test = "raw_exit_from_main_keeps_the_process_alive"
asserts = "A raw exit from the main task completes that task only; the process ends with the status of a later exit_group from another task, and a raw exit_group runs no atexit handlers."

