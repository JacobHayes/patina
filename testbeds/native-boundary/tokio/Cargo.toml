[workspace]

[package]
name = "patina-tokio-probe"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "=1.53.1", features = ["rt", "net", "io-util", "macros", "time", "signal"] }
parking_lot = "=0.12.5"
rustix = { version = "=1.1.4", features = ["fs"] }

[[bin]]
name = "patina-tokio-probe"
path = "src/main.rs"
