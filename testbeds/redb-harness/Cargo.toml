# Standalone package: its own empty [workspace] table keeps it OUT of the root
# Patina workspace so `cargo` here never touches crates/ or the root manifest.
[workspace]

[package]
name = "redb-harness"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "redb-harness"
path = "src/main.rs"

[dependencies]
# The system under test, pinned exact. redb is a pure-Rust embedded key/value
# store with a single-file on-disk format, MVCC snapshots, and an explicit
# commit/durability model -- exactly the durability surface the Patina crash
# filesystem exists to fuzz. No other runtime deps: the workload PRNG is an
# inline splitmix64 and the state digest is a hand-rolled FNV-1a, so the
# dependency tree under test is redb and redb alone.
# PATINA FORK of redb 4.1.0, vendored at ../redb-fork with cooperative-SUT
# (buggify) sites wired into its commit and recovery paths. Byte-for-byte
# upstream except for the `patina_dst::`-tagged sites; a plain build behaves exactly
# like `redb = "=4.1.0"`.
redb = { path = "../redb-fork" }

# The Patina cooperative-SUT SDK (default features = dependency-light SDK). The
# harness uses it only to mark the setup/workload boundary via
# `patina_dst::lifecycle::setup_complete()`; outside a Patina build every SDK call is
# a no-op, so the plain `run-native.sh` build is unchanged.
patina-dst = { path = "../../crates/patina" }

# The Patina proptest compat + in-house model-based (stateful) testing layer,
# used only by `--mode stateful` (a new bin mode). Its command generation is
# seeded from `patina_dst::rng()`, so a stateful run is deterministic from the Patina
# run seed. The default crash/full/write/verify modes and the buggify sweep do
# not touch it.
patina-dst-proptest = { path = "../../crates/patina-proptest" }
proptest = { version = "1.11.0", default-features = false, features = ["std", "bit-set"] }

[profile.release]
# Keep unwinding so the harness can surface a panic message (invariant
# violations exit non-zero via process::exit, but a redb bug may panic) and so
# the future Patina phase gets readable backtraces.
panic = "unwind"
