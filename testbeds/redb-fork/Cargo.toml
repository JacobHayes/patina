# PATINA FORK of redb 4.1.0 (crates.io checksum
# 8e925444704b5f17d32bf42f5b6e2df050bceebc3dcd6e71cc73dafe8092e839).
#
# This is a MINIMAL, CLEARLY MARKED fork of the upstream `redb` embedded
# key/value store, vendored so the Patina cooperative-SUT (buggify) SDK can be
# wired into its real commit and recovery paths. The ONLY source changes from
# upstream are the `patina_dst::{buggify!, buggify_delay!, sometimes!, reachable!,
# always!}` call sites, each tagged with a `PATINA FORK:` comment and grep-able
# by the `patina` marker. Examples, tests, benches, and fuzz targets are dropped;
# `src/` and `build.rs` are byte-for-byte upstream except for those tagged sites.
#
# Every buggify macro is a no-op outside a Patina build, so a plain `cargo build`
# here compiles and behaves exactly like upstream redb. Only when the redb-harness
# is built through `cargo patina build` do the sites become live.

[workspace]

[package]
edition = "2024"
rust-version = "1.89"
name = "redb"
version = "4.1.0"
authors = ["Christopher Berner <me@cberner.com>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust Embedded DataBase (Patina fork with cooperative-SUT sites)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cberner/redb"

[features]
cache_metrics = []
logging = ["dep:log"]

[lib]
name = "redb"
path = "src/lib.rs"

# The Patina cooperative-SUT SDK. Default features only (the dependency-light
# SDK): outside a Patina build every macro is a no-op, so this fork stays a
# drop-in redb.
[dependencies.patina-dst]
path = "../../crates/patina"

[dependencies.chrono_v0_4]
version = "0.4.41"
optional = true
package = "chrono"

[dependencies.log]
version = "0.4.17"
optional = true

[dependencies.uuid]
version = "1.17.0"
optional = true

[target.'cfg(target_os = "wasi")'.dependencies.libc]
version = "0.2.174"

[lints.clippy]
big_endian_bytes = "deny"
dbg_macro = "deny"
host_endian_bytes = "deny"
